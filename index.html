function mapaHTML(k){
  var rs=rubrosDe(S,k,hoyISO()).filter(function(r){ return r.gastoC>0; });
  if(!rs.length) return '<div class="vacio">Sin gastos registrados en este corte.</div>';
  var datos=rs.map(function(r){ return {nombre:r.cat, valor:r.gastoC}; });
  var bl=squarify(datos,100,85);
  var n=bl.length;
  var h='<div class="mapa" style="padding-bottom:85%;height:0">';
  bl.forEach(function(b,i){
    var l=88-Math.round(i/Math.max(1,n-1)*26);
    h+='<button class="blq" data-acc="rubro" data-v="'+esc(b.d.nombre)+'" data-k="'+esc(k)+'" '+
      'style="left:'+pc(b.x)+'%;top:'+pc(b.y/85*100)+'%;width:'+pc(b.w)+'%;height:'+pc(b.h/85*100)+'%;'+
      'background:hsl(205,17%,'+l+'%)">'+
      '<span>'+esc(b.d.nombre)+'</span><span class="m num">'+fmtC(b.d.valor)+'</span></button>';
  });
  return h+'</div>';
}
function pc(n){ return (Math.round(n*1000)/1000); }
/* El rótulo solo si el bloque da el ancho y el alto para leerlo. */
function pintaMapas(){
  var bs=document.querySelectorAll(".blq");
  for(var i=0;i<bs.length;i++){
    var b=bs[i];
    if(b.offsetWidth<74 || b.offsetHeight<38){ b.innerHTML=""; continue; }
    if(b.offsetHeight<56){ var m=b.querySelector(".m"); if(m) m.style.display="none"; }
  }
}

/* ---------- 4 · REGISTRO MANUAL DE COMPRAS ---------- */
function vRegistro(){
  var q=norm(VISTA.busca||"");
  var arr=NOTAS.filter(function(n){ return coincide(n,q); });
  var h='<div class="caja"><div class="caja-t"><h2>Registro manual de compras</h2>'+
    '<span class="sp"></span><button class="lnk" data-acc="ex" data-ex="registro">qué es</button></div>'+
    '<div style="padding:10px 12px 12px">'+
      '<button class="bgrande" data-acc="nota-nueva">Anotar una compra</button>'+
      '<div class="sub" style="margin-top:7px">Recordatorio suelto. No suma, no resta y no entra en ningún total. '+
        'Firmando como <b>'+esc(nombreYo()||"sin nombre")+'</b> &middot; '+
        '<button class="lnk" data-acc="nombre">cambiar</button></div>'+
    '</div></div>';
  if(ERRN) h+='<div class="caja"><div class="nota" style="margin:10px 12px">'+
      'No se pueden leer las anotaciones ('+esc(ERRN)+'). Si dice <b>permission-denied</b>, '+
      'falta agregar la colección <b>notas</b> a las reglas de Firestore.</div></div>';
  h+='<div class="caja"><div style="padding:10px 12px">'+
      '<input class="buscar" id="busca" placeholder="Buscar" value="'+esc(VISTA.busca||"")+'">'+
    '</div><div id="lista-notas">'+listaNotas(arr)+'</div></div>';
  return h;
}
function coincide(n,q){
  return !q || norm(n.que).indexOf(q)>=0 || norm(n.autor).indexOf(q)>=0 ||
         norm(n.pago||"").indexOf(q)>=0 || (n.fecha||"").indexOf(q)>=0;
}
function listaNotas(arr){
  if(!arr.length) return '<div class="vacio">'+(NOTAS.length? "Ninguna anotación coincide." : "Todavía no hay anotaciones.")+'</div>';
  return arr.map(function(n){
    return '<div class="nt"><span class="f num">'+esc(fmtF(n.fecha))+'</span>'+
      '<span class="q"><b>'+esc(n.que||"—")+'</b>'+
        '<span class="a">'+esc([n.pago,n.autor].filter(Boolean).join(" · ")||"—")+'</span></span>'+
      '<span class="m num">'+fmtC(cts(n.monto))+'</span>'+
      '<button class="x" data-acc="nota-borrar" data-v="'+esc(n.id)+'" title="Borrar la anotación">×</button></div>';
  }).join("");
}

/* ---------- hoja emergente ---------- */
function abreHoja(html,arriba){
  cierraHoja();
  var f=document.createElement("div");
  f.className="fondo"+(arriba?" arriba":""); f.id="fondo";
  f.innerHTML='<div class="hoja'+(arriba?" arriba":"")+'">'+html+'</div>';
  f.addEventListener("click", function(e){ if(e.target===f) cierraHoja(); });
  document.body.appendChild(f);
  aplicaEscala();
  ajustaTeclado();
}
function cierraHoja(){ var f=document.getElementById("fondo"); if(f) f.remove(); }
function explica(clave){
  var e=EX[clave]; if(!e) return;
  abreHoja('<h3>'+esc(e[0])+'</h3><p>'+e[1]+'</p>'+
    '<div class="pasos"><button data-acc="cerrar-hoja">Entendido</button></div>');
}
function toast(t){
  var d=document.createElement("div"); d.className="toast"; d.textContent=t;
  document.body.appendChild(d);
  setTimeout(function(){ try{ d.remove(); }catch(e){} }, 2600);
}

/*==BLOQUE-VISTA-FIN==*/

/* =============================================================================
   EVENTOS · toques
============================================================================= */
function txtPlano(h){ var d=document.createElement("div"); d.innerHTML=String(h||"").replace(/<br>/g," "); return d.textContent||""; }
function ponTitulos(){
  var ns=document.querySelectorAll("[data-ex]");
  for(var i=0;i<ns.length;i++){
    var e=EX[ns[i].getAttribute("data-ex")];
    if(e) ns[i].title=e[0]+" — "+txtPlano(e[1]);
  }
}
var LARGO=null, SALTA=false;
document.addEventListener("pointerdown", function(e){
  var t=e.target.closest && e.target.closest("[data-ex]");
  if(!t) return;
  clearTimeout(LARGO);
  LARGO=setTimeout(function(){ SALTA=true; explica(t.getAttribute("data-ex")); }, 480);
}, true);
["pointerup","pointercancel","pointermove","scroll"].forEach(function(ev){
  document.addEventListener(ev, function(){ clearTimeout(LARGO); }, true);
});

document.addEventListener("click", function(e){
  if(SALTA){ SALTA=false; return; }
  var t=e.target.closest && e.target.closest("[data-acc]");
  if(!t) return;
  var acc=t.getAttribute("data-acc"), v=t.getAttribute("data-v");

  if(acc==="tab"){ VISTA.tab=v; VISTA.cierre=null; cierraHoja(); window.scrollTo(0,0); pinta(); return; }
  if(acc==="bloquear"){ bloquear(); return; }
  if(acc==="esc"){ cambiaEscala(v==="+"? 0.1 : -0.1); return; }
  if(acc==="ex"){ explica(t.getAttribute("data-ex")); return; }
  if(acc==="cerrar-hoja"){ cierraHoja(); return; }
  if(acc==="vertodos"){ VISTA.verTodos=!VISTA.verTodos; pinta(); return; }
  if(acc==="rubro"){
    var kk=t.getAttribute("data-k"); if(kk){ VISTA.k=kk; }
    hojaRubro(v); return;
  }
  if(acc==="rubro-sel"){ VISTA.rubro=v; pinta(); return; }
  if(acc==="cierre"){ VISTA.cierre = (VISTA.cierre===v? null : v); pinta(); return; }
  if(acc==="cierre-presu"){ hojaPresuVentana(v); return; }
  if(acc==="cierre-cotejo"){ hojaCotejo(v); return; }
  if(acc==="proy"){ hojaProyeccion(v); return; }
  if(acc==="menu"){ hojaMenu(); return; }
  if(acc==="elegir"){ hojaElegir(); return; }
  if(acc==="elegir-ok"){
    var ms=document.querySelectorAll("#lista-int input:checked"), out=[];
    for(var i=0;i<ms.length;i++) out.push(ms[i].getAttribute("data-r"));
    guardaInteres(out); cierraHoja(); pinta(); return;
  }
  if(acc==="nombre"){ pedirNombre(true); return; }
  if(acc==="nombre-ok"){
    var n=(document.getElementById("nomIn")||{}).value||"";
    n=n.trim().slice(0,18);
    if(n){ lsSet(LL.nom,n); cierraHoja(); pinta(); }
    return;
  }
  if(acc==="nota-nueva"){ NOTA={fecha:hoyISO(), que:"", monto:"", pago:""}; notaPaso(1); return; }
  if(acc==="nota-paso"){ notaPaso(+v); return; }
  if(acc==="nota-forma"){ guardaNota(v); return; }
  if(acc==="tj-gasto"){ hojaGastoTj(v); return; }
  if(acc==="tj-cupo"){ hojaCupoTj(v); return; }
  if(acc==="tj-ics"){ bajaIcs(v); return; }
  if(acc==="bn"){ hojaRubro(v); return; }
  if(acc==="nota-borrar"){ pideBorrar(t,v); return; }
  if(acc==="nota-borrar-ok"){ borraNota(v); return; }
}, false);

document.addEventListener("keydown", function(e){
  if(e.key==="Escape") cierraHoja();
}, false);
document.addEventListener("change", function(e){
  var t=e.target;
  if(t && t.id==="selK"){ VISTA.k=t.value; VISTA.cierre=null; pinta(); }
}, false);
document.addEventListener("input", function(e){
  var t=e.target;
  if(t && t.id==="busca"){
    VISTA.busca=t.value;
    var q=norm(VISTA.busca), l=document.getElementById("lista-notas");
    if(l) l.innerHTML=listaNotas(NOTAS.filter(function(n){ return coincide(n,q); }));
  }
}, false);

function hoyISO(){ var d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

/* ---------- elegir rubros de interés (queda en ESTE aparato) ---------- */
function hojaMenu(){
  abreHoja('<h3>Ajustes de este aparato</h3>'+
    '<div class="hsub">Nada de esto toca los datos ni se comparte: vale solo para este teléfono.</div>'+
    '<div class="fila-aj"><span>Tamaño de letra</span>'+
      '<span class="esc"><button data-acc="esc" data-v="-">A−</button>'+
      '<b id="escPct" class="num">'+Math.round(escalaMia()*100)+'%</b>'+
      '<button data-acc="esc" data-v="+">A+</button></span></div>'+
    '<div class="fila-aj"><span>Nombre en este aparato<br><span class="sub">'+
      esc(nombreYo()||"sin nombre")+'</span></span>'+
      '<button class="lnk" data-acc="nombre">cambiar</button></div>'+
    '<div class="pasos"><button data-acc="cerrar-hoja">Cerrar</button>'+
      '<button data-acc="bloquear">Bloquear</button></div>');
}
function hojaElegir(){
  var k=kAct(), rs=rubrosDe(S,k,hoyISO()), sel=interes();
  rs.sort(function(a,b){ if(a.gastoC!==b.gastoC) return b.gastoC-a.gastoC;
    return String(a.cat).localeCompare(String(b.cat)); });
  abreHoja('<h3>Rubros de interés</h3>'+
    '<div class="hsub">Los marcados salen grandes arriba. Se guarda solo en este aparato: '+
      'no toca nada de la app madre y cada quien puede tener los suyos.</div>'+
    '<div id="lista-int">'+rs.map(function(r){
      return '<label class="cbox"><input type="checkbox" data-r="'+esc(r.cat)+'"'+
        (sel.indexOf(r.cat)>=0?" checked":"")+'><span>'+esc(r.cat)+'</span>'+
        '<span class="sub num">'+fmtC(r.gastoC)+'</span></label>'; }).join("")+'</div>'+
    '<div class="pasos"><button data-acc="cerrar-hoja">Cancelar</button>'+
      '<button class="pri" data-acc="elegir-ok">Guardar</button></div>');
}
/* ---------- nombre corto de este aparato ---------- */
function pedirNombre(puedeCancelar){
  abreHoja('<h3>¿Quién usa este aparato?</h3>'+
    '<div class="hsub">Un nombre corto. Firma las notas y separa los rubros de interés de cada quien. '+
      'Se guarda acá, no en la nube.</div>'+
    '<div class="paso"><input id="nomIn" maxlength="18" placeholder="Victor" value="'+esc(nombreYo())+'"></div>'+
    '<div class="pasos">'+(puedeCancelar?'<button data-acc="cerrar-hoja">Cancelar</button>':
      '<button data-acc="cerrar-hoja">Después</button>')+
      '<button class="pri" data-acc="nombre-ok">Guardar</button></div>');
  setTimeout(function(){ var i=document.getElementById("nomIn"); if(i) try{ i.focus(); }catch(e){} },140);
}

/* =============================================================================
   § NOTAS · LA ÚNICA ESCRITURA DE ESTA APP, Y VA EN OTRA COLECCIÓN
   -----------------------------------------------------------------------------
   Un documento por nota en la colección "notas". El documento finanzas/estado
   no se toca jamás. Una nota es un recordatorio: no suma, no resta y no entra
   en ningún total de ningún corte.
============================================================================= */
var NOTA={fecha:"",que:"",monto:"",pago:""};
function leeCampo(id){ var e=document.getElementById(id); return e? e.value : ""; }
/* Cuatro pasos, uno por pantalla. Las hojas con campo de texto se anclan ARRIBA:
   abajo el teclado del celular las tapa. */
function notaPaso(n){
  if(n>=2) NOTA.fecha=leeCampo("nFecha")||NOTA.fecha||hoyISO();
  if(n>=3) NOTA.que  =leeCampo("nQue")||NOTA.que;
  if(n>=4) NOTA.monto=leeCampo("nMonto")||NOTA.monto;
  var h,foco;
  if(n===1){
    h='<h3>¿Qué día fue?</h3><div class="hsub">Paso 1 de 4</div>'+
      '<div class="paso"><input id="nFecha" type="date" value="'+esc(NOTA.fecha||hoyISO())+'"></div>'+
      '<div class="pasos"><button data-acc="cerrar-hoja">Cancelar</button>'+
        '<button class="pri" data-acc="nota-paso" data-v="2">Siguiente</button></div>';
  }else if(n===2){
    h='<h3>¿Qué compraste?</h3><div class="hsub">Paso 2 de 4 &middot; '+esc(fmtFL(NOTA.fecha))+'</div>'+
      '<div class="paso"><input id="nQue" maxlength="80" placeholder="Titán · aceite" value="'+esc(NOTA.que)+'"></div>'+
      '<div class="pasos"><button data-acc="nota-paso" data-v="1">Atrás</button>'+
        '<button class="pri" data-acc="nota-paso" data-v="3">Siguiente</button></div>';
    foco="nQue";
  }else if(n===3){
    h='<h3>¿Cuánto?</h3><div class="hsub">Paso 3 de 4 &middot; '+esc(NOTA.que||"—")+'</div>'+
      '<div class="paso"><input id="nMonto" inputmode="decimal" placeholder="850.00" value="'+esc(NOTA.monto)+'"></div>'+
      '<div class="pasos"><button data-acc="nota-paso" data-v="2">Atrás</button>'+
        '<button class="pri" data-acc="nota-paso" data-v="4">Siguiente</button></div>';
    foco="nMonto";
  }else{
    var fs=formasDe(S||{});
    h='<h3>¿Con qué pagaste?</h3><div class="hsub">Paso 4 de 4 &middot; '+
      esc(NOTA.que||"—")+' &middot; '+fmtC(cts(parseFloat(String(NOTA.monto).replace(/[^0-9.\-]/g,""))||0))+'</div>'+
      '<div class="formas">'+fs.map(function(f){
        return '<button data-acc="nota-forma" data-v="'+esc(f)+'"'+
          (clave(f)===clave(NOTA.pago)?' class="on"':'')+'>'+esc(f)+'</button>'; }).join("")+
        '<button data-acc="nota-forma" data-v="">Sin especificar</button></div>'+
      '<div class="pasos"><button data-acc="nota-paso" data-v="3">Atrás</button></div>';
  }
  abreHoja(h, n>=2 && n<=3);
  if(foco) setTimeout(function(){ var i2=document.getElementById(foco);
    if(i2){ try{ i2.focus(); i2.setSelectionRange(i2.value.length,i2.value.length); }catch(e){} } },140);
}
/* Tocar la forma de pago guarda: es el último paso. */
function guardaNota(forma){
  NOTA.pago=forma||"";
  var m=parseFloat(String(NOTA.monto).replace(/[^0-9.\-]/g,""));
  if(isNaN(m)){ toast("Falta el monto"); notaPaso(3); return; }
  if(!NOTA.que){ toast("Falta qué compraste"); notaPaso(2); return; }
  if(!FB_OK || !SESION){ toast("Sin sesión: no se guardó"); return; }
  var d={ fecha:NOTA.fecha||hoyISO(), que:NOTA.que, monto:red(m), pago:NOTA.pago,
          autor:nombreYo()||"sin nombre", ts:Date.now() };
  cierraHoja();
  colNotas().add(d)
    .then(function(){ toast("Anotado"); })
    .catch(function(e){ toast("No se pudo guardar: "+((e&&e.code)||"error")); });
}
/* Borrar en dos toques, sin cuadro de diálogo del navegador. */
function pideBorrar(bt,id){
  var otros=document.querySelectorAll('[data-acc="nota-borrar-ok"]');
  for(var i=0;i<otros.length;i++){
    otros[i].setAttribute("data-acc","nota-borrar"); otros[i].textContent="×";
    otros[i].style.color=""; otros[i].style.fontSize="";
  }
  bt.setAttribute("data-acc","nota-borrar-ok");
  bt.textContent="borrar";
  bt.style.color="var(--mal-tx)"; bt.style.fontSize="12px";
}
function borraNota(id){
  colNotas().doc(id).delete()
    .then(function(){ toast("Nota borrada"); })
    .catch(function(e){ toast("No se pudo borrar: "+((e&&e.code)||"error")); });
}
</script>

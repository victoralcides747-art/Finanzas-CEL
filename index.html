<!doctype html>
<!--
  FINANZAS DEL HOGAR · APP SATÉLITE DE CONSULTA
  ---------------------------------------------------------------------------
  Un solo archivo. Lee el documento finanzas/estado de la app madre y lo
  muestra en el celular. NO lo escribe nunca: lo único que escribe son las
  notas, y van en la colección aparte "notas".

  Para tenerla como app en el celular: abrirla en el navegador y
    · iPhone  → Compartir → Agregar a inicio
    · Android → menú (⋮) → Agregar a pantalla principal
  Entra con el mismo PIN de 6 dígitos de la app madre.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Finanzas · consulta</title>
<meta name="theme-color" content="#f2f2f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Consulta">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════════════════
   App satélite · SOLO LECTURA del documento finanzas/estado.
   Misma paleta tenue que la app madre. Sin semáforos, sin badges.
   Pensada para celular en vertical: todo el ancho, números grandes.
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --z:1;
  --bg:#f2f2f0; --card:#fcfcfb; --card2:#f8f8f6;
  --linea:#e3e2de; --linea2:#eeedea; --linea3:#f5f4f1;
  --tx:#0b0b0b; --tx2:#52514e; --tx3:#8b8a84;
  --plan:#2a78d6; --plan-tx:#1c5cab; --plan-bg:#f3f8fe; --plan-linea:#d9e8fb; --plan-pista:#cde2fb;
  --gasto-tx:#a85a10; --gasto:#e8a24e; --gasto-pista:#f3d9b6;
  --ok-tx:#006300; --mal-tx:#b02f2f; --avi-tx:#6b4d00; --avi-bg:#fdf8ec; --avi-linea:#eee0bc;
  --r:10px;
  --barra:76px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);
  font:19px/1.44 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc((var(--barra) + 10px) * var(--z,1) + var(--safe-b));
  overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

/* ── cabecera ────────────────────────────────────────────────────── */
header{background:var(--card);border-bottom:1px solid var(--linea);
  position:sticky;top:0;z-index:40;padding-top:env(safe-area-inset-top,0px)}
.hrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:8px 12px}
.marca{font-weight:650;font-size:17.5px;letter-spacing:-.2px;white-space:nowrap;
  flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.hbtn{flex:none;background:none;border:1px solid var(--linea);border-radius:9px;
  padding:8px 12px;color:var(--tx2);font-size:16px;cursor:pointer}
.hrow2{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:0 12px 8px}
select.pill{background:var(--card);border:1px solid var(--linea);border-radius:8px;
  padding:10px 10px;outline:none;font-size:18px;font-weight:600;max-width:64%;
  flex:1 1 auto;min-width:0}
select.pill:focus{border-color:var(--plan)}
.hbtn.men{font-size:22px;line-height:1;padding:4px 12px 9px;letter-spacing:1px}
.esc{display:flex;align-items:center;gap:8px;flex:none}
.esc button{background:var(--card2);border:1px solid var(--linea);border-radius:9px;
  padding:9px 14px;color:var(--tx2);font-size:18px;font-weight:600;cursor:pointer;
  min-width:54px}
.esc b{min-width:58px;text-align:center;font-weight:650}
.fila-aj{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;
  padding:13px 0;border-bottom:1px solid var(--linea3);font-size:17px}
.fila-aj>span:first-child{flex:1;min-width:0}
.est{flex:none;display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;
  background:none;border:0;padding:2px 0;cursor:pointer;text-align:right}
.est-m{font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--tx3)}
.est-v{font-size:13px;color:var(--tx3)}
.est.vivo .est-m{color:var(--ok-tx)}
.est.cache .est-m{color:var(--avi-tx)}
.est.mal .est-m{color:var(--mal-tx)}

/* ── barra de pestañas (abajo, al alcance del pulgar) ─────────────── */
#barra{position:relative;z-index:60}
nav{position:fixed;left:0;bottom:0;width:100vw;max-width:100%;z-index:50;background:var(--card);
  border-top:1px solid var(--linea);display:flex;flex-wrap:wrap;
  padding-bottom:var(--safe-b)}
/* Las cinco pestañas crecen con la escala, pero hasta donde el ancho de la
   pantalla lo permite: cinco palabras no pueden ser más grandes que eso. */
nav button{flex:1 1 auto;background:none;border:0;cursor:pointer;min-width:0;overflow:hidden;
  padding:calc(12px * var(--z,1)) 1px calc(13px * var(--z,1));
  color:var(--tx3);font-size:min(calc(18px * var(--z,1)), 5.6vw);font-weight:600;
  letter-spacing:-.3px;line-height:1.14;
  border-top:calc(2px * var(--z,1)) solid transparent;margin-top:-1px}
nav button.on{color:var(--plan-tx);border-top-color:var(--plan)}

/* ── contenedores ────────────────────────────────────────────────── */
main{padding:10px 12px 20px}
.caja{background:var(--card);border:1px solid var(--linea);border-radius:var(--r);
  margin-bottom:10px;overflow:hidden}
.caja-t{padding:9px 12px 8px;border-bottom:1px solid var(--linea2);
  display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.caja-t h2{margin:0;font-size:15px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--tx3)}
.lnk{background:none;border:0;color:var(--plan-tx);font-size:16px;cursor:pointer;padding:2px 0}
.sub{color:var(--tx3);font-size:15.5px}
.vacio{padding:18px 13px;color:var(--tx3);font-size:16.5px}

/* ── dos números grandes ─────────────────────────────────────────── */
.duo{display:grid;grid-template-columns:1fr;gap:1px;background:var(--linea2)}
.duo>div{background:var(--card);padding:11px 13px 13px;display:flex;
  flex-wrap:wrap;align-items:baseline;gap:0 10px;container-type:inline-size}
.duo .et{order:1;font-size:14px;color:var(--tx3);text-transform:uppercase;letter-spacing:.04em;
  flex:1 0 auto;min-width:0;white-space:nowrap}
.duo .vl{order:2;font-size:clamp(23px,11.1cqw,44px);font-weight:650;letter-spacing:-.8px;
  width:100%;margin-top:1px}
.duo .pie{order:3;font-size:14px;color:var(--tx3);width:100%;margin-top:1px}
.neg{color:var(--mal-tx)}
.caja.proy{background:var(--avi-bg);border-color:var(--avi-linea)}
.caja.proy .caja-t{border-bottom-color:var(--avi-linea)}
.caja.proy .caja-t h2{color:var(--avi-tx)}
.caja.proy .duo,.caja.proy .duo>div{background:transparent}
.caja.proy .duo{gap:0}

/* ── filas de rubro ──────────────────────────────────────────────── */
.rub{display:block;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--linea3);padding:12px 13px 13px;cursor:pointer}
.rub:last-child{border-bottom:0}
.rub .r1{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.rub .nom{font-weight:600;font-size:20.5px;flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.rub .queda{font-weight:650;font-size:20.5px;white-space:nowrap;color:var(--ok-tx)}
.rub .queda.neg{color:var(--mal-tx)}
.rub .queda .sub{color:var(--tx3)}
.rub .r2 .gas{color:var(--gasto-tx)}
.rub .r2 .pre{color:var(--plan-tx)}
.rub .r2{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;font-size:15.5px;color:var(--tx3)}
/* la pista es lo que todavía queda (verde) y lo lleno es lo gastado (naranja) */
.rub .pista{display:block;height:5px;background:#bfe3c6;border-radius:2px;
  margin-top:7px;overflow:hidden}
.rub .pista i{display:block;height:100%;background:var(--gasto);border-radius:2px}
.rub .pista i.over{background:#d98a8a}
.rub.mini{padding:9px 13px 10px}
.rub.mini .nom{font-weight:500;font-size:18px}
.rub.mini .queda{font-size:17.5px;font-weight:600}
.rub.mini .r2{font-size:14px;margin-top:2px}

/* ── tarjetas ────────────────────────────────────────────────────── */
.tj{border-bottom:1px solid var(--linea2);padding:16px 15px 18px;
  border-left:6px solid var(--tj-ln,var(--linea));background:var(--tj-bg,transparent)}
.tj:last-child{border-bottom:0}
.tj-n{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.tj-n b{font-size:28px;font-weight:700;flex:1 1 auto;min-width:0;letter-spacing:-.5px;
  overflow-wrap:anywhere}
.tj-c{font-size:19px;font-weight:700;color:var(--plan-tx);white-space:nowrap}
.tj-g{margin-top:12px}
.tj-g>div{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 12px;
  padding:8px 0 9px;border-top:1px solid var(--tj-ln,var(--linea2));container-type:inline-size}
.tj-g .et{font-size:14px;color:var(--tx2);text-transform:uppercase;letter-spacing:.02em;flex:1;min-width:0}
.tj-g .vl{font-size:clamp(21px,9.4cqw,34px);font-weight:650;letter-spacing:-.6px;
  width:100%;margin-top:2px}
.tj-g .vl.chico{font-size:19px;font-weight:500;color:var(--tx2);width:100%;margin-top:2px}
.tj-c.urge{color:var(--avi-tx);font-weight:650}
.tj-g .pie-est{width:100%;font-size:14.5px;color:var(--tx2);margin-top:2px}
.tj-g .pie-est.pend{color:var(--avi-tx);font-weight:600}
/* el corte anterior: una línea, cifra chica, el estado en un símbolo */
.tj-ant{margin-top:2px;padding:8px 0 9px;border-top:1px solid var(--tj-ln,var(--linea2));
  display:flex;align-items:baseline;gap:0 10px;flex-wrap:wrap}
.tj-ant .e{flex:1 1 auto;min-width:0;font-size:14px;color:var(--tx2);
  text-transform:uppercase;letter-spacing:.02em}
.tj-ant .v{font-size:20px;font-weight:600;color:var(--tx2)}
.tj-ant .x{width:100%;font-size:14.5px;color:var(--tx2)}
.tj-ant .x.pend{color:var(--avi-tx);font-weight:600}
.tj-ant .lnk{font-size:14.5px;padding:0;margin-top:2px}
.mk{font-size:15px;font-weight:600;white-space:nowrap}
.mk.ok{color:var(--ok-tx)}
.mk.no{color:var(--avi-tx)}
/* el disponible: el número que manda en la tarjeta */
.tj-d{margin-top:4px;padding:2px 0 8px;container-type:inline-size}
.tj-d .et{display:block;font-size:14px;color:var(--tx2);text-transform:uppercase;letter-spacing:.02em}
.tj-d .vl{display:block;font-size:clamp(26px,12cqw,42px);font-weight:700;letter-spacing:-.7px;
  margin-top:1px;color:var(--ok-tx)}
.tj-d .vl.neg{color:var(--mal-tx)}
.tj-d .pie-est{display:block;font-size:14.5px;color:var(--tx2);margin-top:3px}
/* beneficios: el rubro a la izquierda, lo que le queda a ese rubro a la derecha */
.bn{display:flex;align-items:baseline;gap:0 10px;flex-wrap:wrap;padding:7px 0;
  border-top:1px solid var(--tj-ln,var(--linea2))}
.bn .q{flex:1 1 auto;min-width:0;font-size:19px;font-weight:650;overflow-wrap:anywhere}
.bn .d{font-size:19px;font-weight:650;color:var(--ok-tx);white-space:nowrap}
.bn .d.neg{color:var(--mal-tx)}
.bn .d.sin{font-size:15px;font-weight:500;color:var(--tx3)}
.bn .p{width:100%;font-size:15px;color:var(--tx2);margin-top:1px}
.bn.pref .q{font-weight:600;color:var(--tx2)}
/* los datos fríos, al final y en chico */
.tj-f{display:flex;gap:0 12px;flex-wrap:wrap;font-size:14.5px;color:var(--tx3);
  align-items:baseline;margin-top:5px}
.tj-f b{font-weight:650;color:var(--tx2)}
.tj-f .pend{color:var(--avi-tx);font-weight:600}
.linea-det .pend{color:var(--avi-tx);font-weight:600}
.linea-det b{font-weight:650;color:var(--tx)}
/* la cuenta del cupo, renglón por renglón */
.cta{display:flex;align-items:baseline;gap:10px;padding:7px 0;
  border-bottom:1px solid var(--linea2)}
.cta .e{flex:1 1 auto;min-width:0;font-size:16.5px}
.cta .e small{display:block;font-size:14px;color:var(--tx2);margin-top:1px}
.cta .v{font-size:19px;font-weight:600;white-space:nowrap}
.cta.res .v{color:var(--gasto-tx)}
.cta.tot{border-bottom:0;border-top:2px solid var(--linea);margin-top:2px}
.cta.tot .e{font-weight:650}
.cta.tot .v{font-size:22px;font-weight:700}
.cta.tot.fin .v{color:var(--ok-tx)}
.formas{display:flex;flex-wrap:wrap;gap:9px;margin:2px 0}
.formas button{flex:1 1 44%;min-width:0;background:var(--card2);border:1px solid var(--linea);
  border-radius:11px;padding:15px 12px;font-size:17.5px;color:var(--tx);cursor:pointer;
  text-align:left;overflow-wrap:break-word}
.formas button.on{background:var(--plan-bg);border-color:var(--plan-linea);
  color:var(--plan-tx);font-weight:650}
.nota{font-size:15.5px;color:var(--avi-tx);background:var(--avi-bg);
  border:1px solid var(--avi-linea);border-radius:7px;padding:5px 8px;margin-top:7px}
.bene{font-size:17px;color:var(--tx2);margin-top:7px}
.bene b{font-weight:600}
.linea-det{display:flex;gap:10px;margin-top:9px;font-size:16.5px;color:var(--tx3);
  align-items:baseline;flex-wrap:wrap}

/* ── recomendación ───────────────────────────────────────────────── */
.rec{border-bottom:1px solid var(--linea2);padding:14px 13px 15px;display:flex;gap:10px;
  border-left:6px solid var(--tj-ln,transparent);background:var(--tj-bg,transparent)}
.rec:last-child{border-bottom:0}
.rec .pos{font-size:16px;color:var(--tx3);font-weight:700;min-width:16px;padding-top:3px}
.rec .cu{flex:1;min-width:0}
.rec .cu{display:block}
.rec .tit{display:block;font-size:22px;font-weight:650}
.rec .fr{display:block;font-size:17.5px;color:var(--tx2);margin-top:3px}
.rec .fr .sep{color:#c3c2be;padding:0 3px}
.rec.apagada .tit,.rec.apagada .fr{color:var(--tx3)}
.aviso{font-size:16.5px;color:var(--tx2);padding:11px 13px;border-top:1px solid var(--linea2);
  background:var(--card2)}
.aviso+.aviso{border-top:1px solid var(--linea3)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:9px 12px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{background:var(--card2);border:1px solid var(--linea);border-radius:22px;
  padding:11px 17px;font-size:17.5px;white-space:nowrap;cursor:pointer;color:var(--tx2)}
.chip.on{background:var(--plan-bg);border-color:var(--plan-linea);color:var(--plan-tx);font-weight:600}

/* ── cierres ─────────────────────────────────────────────────────── */
.cie{display:block;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--linea3);padding:13px 13px;cursor:pointer}
.cie:last-child{border-bottom:0}
.cie.on{background:var(--plan-bg)}
.cie .c1{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}
.cie .c1 b{font-weight:650;font-size:20.5px;flex:1 1 auto;min-width:0}
.cie .dif{font-weight:650;font-size:20.5px;white-space:nowrap}
.cie .c2{display:block;font-size:15.5px;color:var(--tx3);margin-top:3px}
.cie .dif{color:var(--ok-tx)}
.cie .dif.neg{color:var(--mal-tx)}
.mapa{position:relative;width:100%;background:var(--card2);
  border-top:1px solid var(--linea2)}
.blq{position:absolute;overflow:hidden;border:1px solid var(--card);
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:4px 5px;cursor:pointer;text-align:left}
.blq span{display:block;font-size:13.5px;line-height:1.2;color:#25313b;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blq span.m{font-weight:650;font-size:14.5px}

/* ── notas ───────────────────────────────────────────────────────── */
.nt{display:flex;gap:11px;align-items:baseline;padding:12px 13px;
  border-bottom:1px solid var(--linea3)}
.nt:last-child{border-bottom:0}
.nt .f{font-size:15px;color:var(--tx3);white-space:nowrap;min-width:54px}
.nt .q{flex:1;min-width:0}
.nt .q b{font-weight:500;font-size:19px}
.nt .a{font-size:14.5px;color:var(--tx3);display:block;margin-top:1px}
.nt .m{font-weight:650;font-size:19px;white-space:nowrap}
.nt .x{background:none;border:0;color:var(--tx3);font-size:19px;line-height:1;
  padding:3px 0 3px 8px;cursor:pointer}
.buscar{width:100%;border:1px solid var(--linea);border-radius:9px;
  padding:13px 12px;font-size:18.5px;outline:none;background:var(--card)}
.buscar:focus{border-color:var(--plan)}
.bgrande{width:100%;background:var(--plan-bg);color:var(--plan-tx);
  border:1px solid var(--plan-linea);border-radius:10px;
  padding:16px;font-size:19.5px;font-weight:650;cursor:pointer}

/* ── hoja emergente (explicaciones, desgloses, pasos) ─────────────── */
.fondo{position:fixed;inset:0;background:rgba(20,20,22,.42);z-index:80;
  display:flex;align-items:flex-end;animation:fd .12s ease-out;
  padding-bottom:var(--kb,0px)}
.fondo.arriba{align-items:flex-start;padding-bottom:0}
@keyframes fd{from{opacity:0}to{opacity:1}}
.hoja{background:var(--card);width:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;
  max-height:calc(86vh / var(--z,1));
  border-radius:14px 14px 0 0;padding:14px 14px calc(18px + var(--safe-b));
  animation:sb .16s ease-out;-webkit-overflow-scrolling:touch}
@keyframes sb{from{transform:translateY(14px)}to{transform:translateY(0)}}
.hoja.arriba{border-radius:0 0 14px 14px;padding-top:calc(14px + env(safe-area-inset-top,0px));
  padding-bottom:18px;max-height:calc(94vh / var(--z,1))}
.hoja h3{margin:0 0 3px;font-size:23px;font-weight:650}
.cot{border-top:1px solid var(--linea2);padding:11px 0 12px}
.cot-t{font-size:19px;font-weight:650;margin-bottom:4px}
.cot-n{display:flex;align-items:baseline;gap:10px;padding:3px 0;font-size:16.5px}
.cot-n span{flex:1;color:var(--tx3)}
.cot-n b{font-weight:650}
.cot-e{font-size:13.5px;color:var(--tx3);margin-top:5px;line-height:1.35}
.hoja .hsec{margin:14px 0 2px;font-size:13.5px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--tx3);border-top:1px solid var(--linea2);padding-top:10px}
.hoja .hsub{color:var(--tx3);font-size:16px;margin-bottom:12px}
.hoja p{margin:0 0 11px;font-size:18px;color:var(--tx2)}
.hoja code{background:var(--card2);border:1px solid var(--linea2);border-radius:5px;
  padding:1px 5px;font-size:16px;font-family:ui-monospace,Menlo,Consolas,monospace}
.mv{display:flex;gap:10px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--linea3)}
.mv:last-child{border-bottom:0}
.mv .f{font-size:15px;color:var(--tx3);min-width:52px}
.mv .d{flex:1;min-width:0;font-size:18px}
.mv .d small{display:block;color:var(--tx3);font-size:14.5px}
.mv .m{font-weight:600;font-size:18px;white-space:nowrap}
.paso input{width:100%;border:1px solid var(--linea);border-radius:10px;
  padding:15px 13px;font-size:22px;outline:none;background:var(--card2)}
.paso input:focus{border-color:var(--plan);background:var(--card)}
.pasos{display:flex;gap:8px;margin-top:12px}
.pasos button{flex:1;border-radius:10px;padding:15px;font-size:19px;font-weight:600;
  cursor:pointer;border:1px solid var(--linea);background:var(--card2);color:var(--tx2)}
.pasos button.pri{background:var(--plan);border-color:var(--plan);color:#fff}

<body>
<div id="app"></div>
<script>
"use strict";
/* =============================================================================
   FINANZAS DEL HOGAR · APP SATÉLITE DE CONSULTA
   -----------------------------------------------------------------------------
   Lee el documento finanzas/estado y lo muestra. NUNCA lo escribe.
   La única escritura de todo el archivo es la colección "notas" (§ NOTAS).
   Si alguna vez aparece un .set/.update/.delete sobre finanzas/estado, está mal.
============================================================================= */

/* =============================================================================
   NUBE · conexión, sesión y escucha en vivo
============================================================================= */
var CORREO_FIJO = "victor@finanzas.app";   /* mismo usuario que la app madre */
var LL = {
  cache:"finanzasSatelite_v1",        /* último JSON recibido, para abrir sin esperar */
  ts:   "finanzasSatelite_v1_ts",     /* ts del documento (marca de la app madre) */
  rx:   "finanzasSatelite_v1_rx",     /* cuándo lo recibió ESTE aparato */
  nom:  "finanzasSatelite_nombre",    /* nombre corto de quien usa este aparato */
  int:  "finanzasSatelite_interes",   /* rubros de interés de ESTE aparato */
  entro:"finanzasSatelite_entro",     /* ya entró con PIN alguna vez en este aparato */
  esc:  "finanzasSatelite_escala"     /* tamaño de letra elegido en este aparato */
};
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

var FB_OK=false, db=null, auth=null, SESION=false;
var S=null;                 /* el estado de la app madre, ya parseado */
var TS_DATO=0;              /* ts que escribió la madre */
var RX=0;                   /* cuándo llegó a este aparato */
var FUENTE="";              /* "vivo" | "cache" | "espera" | "mal" */
var ERR="";                 /* código del último error al leer el estado */
var ERRN="";                /* código del último error al leer las notas */
var NOTAS=[];               /* notas de la colección aparte */

(function initFirebase(){
  try{
    var firebaseConfig = {
      apiKey: "AIzaSyBPrBSABs0WJ7uVXtchPPcksvVEsR5DoDA",
      authDomain: "finanzas-del-hogar-182ca.firebaseapp.com",
      projectId: "finanzas-del-hogar-182ca",
      storageBucket: "finanzas-del-hogar-182ca.firebasestorage.app",
      messagingSenderId: "213840250422",
      appId: "1:213840250422:web:417a7fa0689e08b9e4fa97"
    };
    firebase.initializeApp(firebaseConfig);
    db   = firebase.firestore();
    auth = firebase.auth();
    FB_OK = true;
  }catch(e){ FB_OK=false; }
})();

/* -----------------------------------------------------------------------------
   LA ÚNICA PUERTA AL DOCUMENTO DE LA APP MADRE.
   La referencia se crea acá adentro, se le pide onSnapshot y no sale nunca de
   esta función. No hay ninguna otra mención a "finanzas/estado" en el archivo,
   así que no existe forma de escribirlo, ni por error.
----------------------------------------------------------------------------- */
function escucharEstado(alDato, alError){
  return db.collection("finanzas").doc("estado").onSnapshot(alDato, alError);
}
/* La colección de notas es otra cosa y sí se escribe (ver § NOTAS). */
function colNotas(){ return db.collection("notas"); }

function aplicarEstado(txt, ts, deCache, fromCache){
  var obj=null;
  try{ obj=JSON.parse(txt); }catch(e){ return false; }
  if(!obj || typeof obj!=="object" || !Array.isArray(obj.movimientos)) return false;
  S=obj; normaliza(S);
  TS_DATO = ts||0;
  if(deCache){ FUENTE="cache"; RX=parseInt(lsGet(LL.rx)||"0",10)||0; }
  else{
    FUENTE = fromCache ? "cache" : "vivo";
    RX = Date.now();
    lsSet(LL.cache, txt); lsSet(LL.ts, String(TS_DATO)); lsSet(LL.rx, String(RX));
  }
  return true;
}
/* Rellena lo que falte para no reventar con un estado viejo o incompleto. */
function normaliza(x){
  ["movimientos","ventanas","catE","catI","formas","tarjetas","prestamos"].forEach(function(c){
    if(!Array.isArray(x[c])) x[c]=[];
  });
  ["perms","presu","tjPref","tjPago","prefs","fx","ui"].forEach(function(c){
    if(!x[c] || typeof x[c]!=="object" || Array.isArray(x[c])) x[c]={};
  });
  x.tarjetas = x.tarjetas.map(function(t){
    t = (typeof t==="string") ? {nombre:t} : (t||{});
    return { id:t.id||("tj"+Math.random().toString(36).slice(2,8)), nombre:t.nombre||"",
      corte:(t.corte===0||t.corte)?+t.corte:null, pago:(t.pago===0||t.pago)?+t.pago:null,
      limite:+t.limite||0, limMon:t.limMon||"Lps", tope:+t.tope||0, nota:t.nota||"",
      benes: Array.isArray(t.benes)? t.benes.map(function(b){
        return {que:(b&&b.que)||"", pct:(b&&+b.pct)||0, tope:(b&&+b.tope)||0,
                tipo:(b&&b.tipo==="descuento")?"descuento":"cashback"};
      }) : [] };
  });
}

var desEstado=null, desNotas=null;
function suscribir(){
  if(!FB_OK || !SESION) return;
  if(desEstado) return;
  desEstado = escucharEstado(function(doc){
    ERR="";
    if(!doc || !doc.exists){ FUENTE="vacio"; pinta(); return; }
    var d=doc.data()||{};
    var fc = !!(doc.metadata && doc.metadata.fromCache);
    if(d.datos && aplicarEstado(d.datos, d.ts||0, false, fc)) pinta();
  }, function(e){
    ERR=(e&&e.code)||"error"; FUENTE = S? FUENTE : "mal"; pinta();
  });
  desNotas = colNotas().orderBy("fecha","desc").onSnapshot(function(q){
    var out=[];
    q.forEach(function(d){ var v=d.data()||{}; out.push({
      id:d.id, fecha:v.fecha||"", que:v.que||"", monto:+v.monto||0,
      pago:v.pago||"", autor:v.autor||"", ts:+v.ts||0 }); });
    out.sort(function(a,b){
      if(a.fecha!==b.fecha) return a.fecha<b.fecha?1:-1;
      return b.ts-a.ts;
    });
    NOTAS=out; ERRN="";
    if(VISTA.tab==="registro") pinta();
  }, function(e){ ERRN=(e&&e.code)||"error"; if(VISTA.tab==="registro") pinta(); });
}
function desuscribir(){
  try{ if(desEstado) desEstado(); }catch(e){}
  try{ if(desNotas) desNotas(); }catch(e){}
  desEstado=null; desNotas=null;
}

/* -----------------------------------------------------------------------------
   PIN · el mismo de la app madre (correo fijo interno + PIN como contraseña)
----------------------------------------------------------------------------- */
function pantallaPIN(mensaje, ofreceCache){
  var ov=document.getElementById("pinOv");
  if(!ov){
    ov=document.createElement("div");
    ov.id="pinOv";
    ov.innerHTML=
      '<div class="t1">Finanzas · consulta</div>'+
      '<div class="t2">Ingresá tu PIN para entrar</div>'+
      '<input id="pinIn" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" '+
        'autocomplete="off" placeholder="••••••">'+
      '<button id="pinBt">Entrar</button>'+
      '<div class="msg" id="pinMsg"></div>'+
      '<button class="alt" id="pinAlt" style="display:none">Ver el último dato guardado</button>';
    document.body.appendChild(ov);
    var inp=ov.querySelector("#pinIn");
    ov.querySelector("#pinBt").addEventListener("click", intentarLogin);
    inp.addEventListener("keydown", function(e){ if(e.key==="Enter") intentarLogin(); });
    ov.querySelector("#pinAlt").addEventListener("click", function(){
      var t=lsGet(LL.cache);
      if(t && aplicarEstado(t, parseInt(lsGet(LL.ts)||"0",10)||0, true)){ ocultarPIN(); arrancarVista(); }
    });
    setTimeout(function(){ try{ inp.focus(); }catch(e){} }, 120);
  }
  ov.style.display="flex";
  aplicaEscala();
  ov.querySelector("#pinMsg").textContent = mensaje||"";
  ov.querySelector("#pinAlt").style.display =
    (ofreceCache && lsGet(LL.cache) && lsGet(LL.entro)==="1") ? "block" : "none";
}
function ocultarPIN(){ var o=document.getElementById("pinOv"); if(o) o.style.display="none"; }
function intentarLogin(){
  var ov=document.getElementById("pinOv"); if(!ov) return;
  var inp=ov.querySelector("#pinIn"), bt=ov.querySelector("#pinBt"), msg=ov.querySelector("#pinMsg");
  var pin=(inp.value||"").trim();
  if(pin.length<6){ msg.textContent="El PIN es de 6 dígitos."; return; }
  if(!FB_OK || !auth){ msg.textContent="Sin conexión a la nube."; return; }
  bt.disabled=true; bt.textContent="Entrando…"; msg.textContent="";
  auth.signInWithEmailAndPassword(CORREO_FIJO, pin)
    .then(function(){ lsSet(LL.entro,"1"); })
    .catch(function(err){
      bt.disabled=false; bt.textContent="Entrar"; inp.value=""; try{ inp.focus(); }catch(e){}
      var c=(err&&err.code)||"";
      if(c==="auth/wrong-password"||c==="auth/invalid-credential") msg.textContent="PIN incorrecto.";
      else if(c==="auth/user-not-found") msg.textContent="Usuario no encontrado.";
      else if(c==="auth/too-many-requests") msg.textContent="Demasiados intentos. Esperá un momento.";
      else if(c==="auth/network-request-failed"){ msg.textContent="Sin internet."; pantallaPIN("Sin internet.",true); }
      else msg.textContent="No se pudo entrar: "+c;
    });
}
function bloquear(){
  desuscribir();
  try{ if(auth) auth.signOut(); }catch(e){}
  SESION=false; ARRANCO=false; S=null;
  var a=document.getElementById("app"); if(a) a.innerHTML="";
  var b=document.getElementById("barra"); if(b) b.innerHTML="";
  cierraHoja();
  pantallaPIN("");
}

/* =============================================================================
   TAMAÑO EN PANTALLA
   -----------------------------------------------------------------------------
   Dos cosas distintas, multiplicadas:

   1 · CORRECCIÓN AUTOMÁTICA. Si el navegador está dibujando la página como si
       fuera una computadora ("Sitio para computadoras" activado, o un navegador
       que ignora la etiqueta viewport), la maqueta mide ~980 px y se encoge para
       caber en el celular: todo se ve en miniatura. Se detecta comparando el
       ancho de la maqueta con el ancho real de la pantalla, y se compensa.
   2 · EL TAMAÑO QUE VOS ELIJAS, con A− y A+. Se guarda en este aparato.
============================================================================= */
function factorAuto(){
  try{
    var w=document.documentElement.clientWidth||window.innerWidth||0;
    var p=(window.screen&&window.screen.width)||0;
    if(!w||!p) return 1;
    var r=w/p;
    if(r>1.2) return Math.min(3,r);
    return 1;
  }catch(e){ return 1; }
}
var ESC_MIN=0.5, ESC_MAX=3;
function escalaMia(){
  var v=parseFloat(lsGet(LL.esc)||"1.3");   /* arranca 30% más grande que el diseño */
  return (v>=ESC_MIN && v<=ESC_MAX)? v : 1.3;
}
function aplicaEscala(){
  var z=Math.round(factorAuto()*escalaMia()*100)/100;
  document.documentElement.style.setProperty("--z", z);
  setTimeout(huecoBarra,0);
  ["app","pinOv","fondo"].forEach(function(id){
    var e=document.getElementById(id);
    if(e) e.style.zoom=z;
  });
  return z;
}
function cambiaEscala(d){
  var v=Math.round(Math.min(ESC_MAX,Math.max(ESC_MIN,escalaMia()+d))*100)/100;
  lsSet(LL.esc,String(v));
  aplicaEscala();
  var e=document.getElementById("escPct");
  if(e) e.textContent=Math.round(v*100)+"%"; else toast("Tamaño "+Math.round(v*100)+"%");
}
window.addEventListener("resize", function(){ aplicaEscala(); });

/* EL TECLADO DEL CELULAR.
   Al abrirse, la ventana visible se achica pero la página no se entera: una
   hoja pegada abajo queda tapada. Se mide cuánto ocupa y se levanta la hoja.
   Los pasos con campo de texto además se anclan arriba, que es a prueba de
   todo. */
function ajustaTeclado(){
  var vv=window.visualViewport;
  if(!vv){ return; }
  var tapa=Math.max(0, Math.round((window.innerHeight||vv.height) - vv.height - vv.offsetTop));
  document.documentElement.style.setProperty("--kb", tapa+"px");
}
if(window.visualViewport){
  window.visualViewport.addEventListener("resize", ajustaTeclado);
  window.visualViewport.addEventListener("scroll", ajustaTeclado);
}

var ARRANCO=false;
function arrancarVista(){
  if(ARRANCO) return; ARRANCO=true;
  ocultarPIN();
  pinta();
  if(!lsGet(LL.nom)) setTimeout(function(){ pedirNombre(false); }, 400);
}
function arrancar(){
  /* Abrir mostrando el caché mientras llega el primer snapshot. */
  if(!S){
    var t=lsGet(LL.cache);
    if(t) aplicarEstado(t, parseInt(lsGet(LL.ts)||"0",10)||0, true);
    else FUENTE="espera";
  }
  arrancarVista();
  suscribir();
}
if(FB_OK && auth){
  auth.onAuthStateChanged(function(u){
    if(u){ SESION=true; lsSet(LL.entro,"1"); arrancar(); }
    else{ SESION=false; if(!ARRANCO) pantallaPIN("", true); }
  });
}else{
  pantallaPIN("Sin conexión a la nube.", true);
}

   PWA · el manifiesto se arma acá adentro (un solo archivo, sin .webmanifest

(function manifiesto(){
  var img=null;
  try{
    var i=new Image();
    i.onload=function(){ img=i; armar(); };
    i.onerror=function(){ armar(); };
    i.src=ICONO_SRC;
  }catch(e){ armar(); }
  /* margen: 0 para el ícono normal; 0.11 para el "maskable" de Android, que
     recorta las esquinas para darle la forma de cada lanzador. */
  function icono(px,margen){
    var c=document.createElement("canvas"); c.width=c.height=px;
    var g=c.getContext("2d"), m=margen||0, d=px*m, w=px*(1-2*m);
    g.fillStyle=ICONO_FONDO; g.fillRect(0,0,px,px);
    if(img){ g.drawImage(img,d,d,w,w); }
    else{                                   /* si la imagen no cargó, un dibujo simple */
      var u=w/64;
      g.fillStyle="#1f2933"; g.fillRect(0,0,px,px);
      g.fillStyle="#cfd8e0";
      g.fillRect(d+14*u,d+34*u,8*u,16*u);
      g.fillRect(d+28*u,d+24*u,8*u,26*u);
      g.fillRect(d+42*u,d+14*u,8*u,36*u);
    }
    return c.toDataURL("image/png");
  }
  function armar(){
    try{
      var m={ name:"Finanzas · consulta", short_name:"Consulta", display:"standalone",
        orientation:"portrait", background_color:"#f2f2f0", theme_color:"#f2f2f0",
        start_url:location.href.split("#")[0],
        scope:new URL(".",location.href).href,
        icons:[{src:icono(192),sizes:"192x192",type:"image/png",purpose:"any"},
               {src:icono(512),sizes:"512x512",type:"image/png",purpose:"any"},
               {src:icono(512,0.11),sizes:"512x512",type:"image/png",purpose:"maskable"}] };
      var u=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:"application/manifest+json"}));
      poneLink("manifest",u,"");
      /* iPhone no usa el manifiesto para el ícono: usa este. Sin él, guarda una
         foto de la pantalla. */
      poneLink("apple-touch-icon",icono(180),"180x180");
      poneLink("icon",icono(192),"192x192");
    }catch(e){}
  }
  function poneLink(rel,href,sizes){
    var l=document.createElement("link"); l.rel=rel; l.href=href;
    if(sizes) l.setAttribute("sizes",sizes);
    document.head.appendChild(l);
  }
})();

/*==LOGICA-INI==*/
/* =============================================================================
   LÓGICA · funciones puras sobre el estado. Sin DOM, sin nube.
   Todo el dinero se suma en CENTAVOS enteros y se divide entre 100 al mostrar.
   Las cuatro reglas de hierro viven acá:
     1 · solo los movimientos son dinero
     2 · la app informa, no aplica nada sola
     3 · ninguna cifra de dinero sale de una fecha
     4 · cada ventana es borrón y cuenta nueva
============================================================================= */
var PERIODOS=["Ene-Feb","Feb-Mar","Mar-Abr","Abr-May","May-Jun","Jun-Jul",
              "Jul-Ago","Ago-Sep","Sep-Oct","Oct-Nov","Nov-Dic","Dic-Ene"];

function cts(n){ return Math.round((+n||0)*100); }
function red(n){ return Math.round(n*100)/100; }
function K(a,p){ return a+"|"+p; }
function nomVentana(k){ var p=String(k||"").split("|"); return p[1]? (p[1]+" "+p[0]) : String(k||""); }
function esc(s){ return String(s==null?"":s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmtC(c,signo){          /* centavos → "L 1,234.56" */
  c=Math.round(+c||0);
  var neg=c<0, a=(Math.abs(c)/100).toFixed(2).split("."),
      ent=a[0].replace(/\B(?=(\d{3})+(?!\d))/g,",");
  return (neg?"−":(signo?"+":""))+"L "+ent+"."+a[1];
}
function fmt(n,signo){ return fmtC(cts(n),signo); }
function fmtF(iso){ var p=String(iso||"").split("-"); return p.length<3? String(iso||"") : p[2]+"/"+p[1]; }
function fmtFL(iso){ var p=String(iso||"").split("-"); return p.length<3? String(iso||"") : p[2]+"/"+p[1]+"/"+p[0]; }

/* ---------- movimientos: el único dinero que existe ---------- */
function movsDe(S,k){ return (S.movimientos||[]).filter(function(m){ return m.k===k; }); }
function esIngreso(m){ return m.tipo==="Ingreso"; }
function catDe(m){ return m.cat||"Sin categoría"; }   /* mismo criterio que la app madre */
function ingresosC(S,k){ var c=0;
  movsDe(S,k).forEach(function(m){ if(esIngreso(m)) c+=cts(m.monto); }); return c; }
function gastosC(S,k){ var c=0;
  movsDe(S,k).forEach(function(m){ if(!esIngreso(m)) c+=cts(m.monto); }); return c; }
function saldoC(S,k){ return ingresosC(S,k)-gastosC(S,k); }      /* SIN GASTAR */
function presuDe(S,k){ return (S.presu||{})[k]||{}; }
function totPresuC(S,k){ var p=presuDe(S,k), c=0;
  Object.keys(p).forEach(function(x){ if(p[x]!=null&&p[x]!=="") c+=cts(p[x]); }); return c; }
/* INGRESO PRESUPUESTADO: los permanentes de ingreso activos de la ventana.
   Es lo que la app madre llama "ingresos · presupuesto". */
function planIngresosC(S,k){
  var c=0;
  permsK(S,k).forEach(function(p){
    if(p && p.activo!==false && (p.tipo||"Egreso")==="Ingreso") c+=cts(p.monto);
  });
  return c;
}
/* PRESUPUESTO CONTRA REAL · las nueve cifras de la app madre, con su misma
   cuenta y sus mismos signos. No se inventa nada acá: es su función cotejo().
     ingresos → plan = permanentes de ingreso activos · real = movimientos
     gastos   → plan = suma del presupuesto por rubro · real = movimientos
     saldo    → plan = ingreso presupuestado − gasto presupuestado
   La diferencia va siempre A FAVOR en positivo: en gastos es plan − real. */
function cotejoC(S,k){
  var ing=ingresosC(S,k), egr=gastosC(S,k), queda=ing-egr;
  var pi=planIngresosC(S,k), pg=totPresuC(S,k), pr=pi-pg;
  return {
    ing:{plan:pi, real:ing,   dif:ing-pi},
    egr:{plan:pg, real:egr,   dif:pg-egr},
    res:{plan:pr, real:queda, dif:queda-pr}
  };
}
/* SIN PRESUPUESTAR = el "saldo · presupuesto" de la madre: lo que ella marca
   como el margen que todavía no está asignado a ningún rubro. */
function sinPresupuestarC(S,k){ return cotejoC(S,k).res.plan; }

/* =============================================================================
   PROYECCIÓN · FUERA DEL SALDO REAL
   -----------------------------------------------------------------------------
   Copiada de compromiso() de la app madre, con su misma cuenta:

     por rubro, lo que falta salir es el MAYOR entre
        · el presupuesto asignado que todavía no se gastó, y
        · los permanentes activos del rubro que todavía no se marcaron.
     Se toma el mayor y no la suma: el presupuesto del rubro ya debería cubrir
     sus permanentes. Sumarlos sería contar el mismo dinero dos veces.

     El rubro de ahorro no es un compromiso — esa plata no sale, se guarda — así
     que se aparta y reaparece dentro del saldo libre.

     saldo libre = saldo real + ingreso por entrar − compromisos pendientes
     sobrante sin asignar = saldo libre − ahorro presupuestado

   Nada de esto es dinero real y por eso va rotulado aparte, igual que en ella.
============================================================================= */
function catAhorro(S){ return (S&&S.prefs&&S.prefs.rubroAhorro) || "Ahorro"; }
function ingresoPendienteC(S,k){
  var porCat={}, det=[], tot=0, real={};
  permsActivosK(S,k).forEach(function(f){
    if((f.tipo||"Egreso")!=="Ingreso") return;
    if(movDePerm(S,k,f.id)) return;                    /* ya marcado: ya es real */
    var c=f.cat||f.desc||"Sin categoría";
    porCat[c]=(porCat[c]||0)+cts(f.monto);
  });
  movsDe(S,k).forEach(function(m){
    if(!esIngreso(m)) return;
    var c=catDe(m); real[c]=(real[c]||0)+cts(m.monto);
  });
  Object.keys(porCat).forEach(function(c){
    var v=porCat[c]-(real[c]||0);
    if(v>0){ tot+=v; det.push({cat:c, esperado:porCat[c], recibido:(real[c]||0), val:v}); }
  });
  det.sort(function(a,b){ return b.val-a.val; });
  return {pendiente:tot, det:det};
}
function compromisoC(S,k,hoyIso){
  var pend=0, det=[], ca=catAhorro(S), res=0;
  rubrosDe(S,k,hoyIso).forEach(function(r){
    /* Un rubro que solo recibe devoluciones tiene gasto NEGATIVO. Restar un
       negativo inventaría un compromiso que no existe (presupuesto 0 y −279 de
       reembolsos daba +279), así que el gasto se topa en cero SOLO para esta
       cuenta. Para mostrar, el negativo se deja: es real. */
    var g=Math.max(0, r.gastoC);
    var porPres=(r.presC)? Math.max(0, r.presC-g) : 0;
    var porPerm=r.permPendC;
    var v=Math.max(porPres,porPerm);
    if(v>0){
      pend+=v;
      det.push({cat:r.cat, porPres:porPres, porPerm:porPerm, val:v, ahorro:(r.cat===ca)});
      if(r.cat===ca) res=v;
    }
  });
  det.sort(function(a,b){ return b.val-a.val; });
  var queda=saldoC(S,k), ip=ingresoPendienteC(S,k);
  /* El rubro de ahorro cuenta como compromiso MIENTRAS la ventana está viva:
     esa plata no está disponible. Al cerrar vuelve a ser ahorro. */
  var libre=queda+ip.pendiente-pend;
  return {pendiente:pend, det:det, ingPend:ip.pendiente, ingDet:ip.det,
          ahorroPend:res, libre:libre};
}
/* Al cerrar la ventana, el ahorro de verdad es lo que ya apartaste al rubro de
   ahorro más lo que sobre del saldo. */
function apartadoAhorroC(S,k){
  var ca=catAhorro(S), c=0;
  movsDe(S,k).forEach(function(m){ if(!esIngreso(m) && catDe(m)===ca) c+=cts(m.monto); });
  return c;
}
function ahorroAlCerrarC(S,k){ return sobroC(S,k); }
function gastoCatC(S,k,cat){ var c=0;
  movsDe(S,k).forEach(function(m){ if(!esIngreso(m) && catDe(m)===cat) c+=cts(m.monto); }); return c; }
function movsCat(S,k,cat){
  return movsDe(S,k).filter(function(m){ return !esIngreso(m) && catDe(m)===cat; })
    .sort(function(a,b){ return String(a.fecha||"").localeCompare(String(b.fecha||"")); });
}
/* Lista de rubros con la misma composición que usa la app madre: los rubros de
   la lista, más los que aparecen en movimientos, más los que tienen presupuesto,
   más los de los permanentes activos. */
function permsK(S,k){ return ((S.perms||{})[k])||[]; }
function permsActivosK(S,k){ return permsK(S,k).filter(function(f){ return f && f.activo!==false; }); }
/* Los permanentes de gasto de un rubro que este período tocan — igual que la madre. */
function permsDeRubro(S,k,cat,hoyIso){
  return permsActivosK(S,k).filter(function(p){
    return (p.tipo||"Egreso")!=="Ingreso" && (p.cat||"Sin categoría")===cat && permToca(S,p,hoyIso);
  });
}
function rubrosDe(S,k,hoyIso){
  var p=presuDe(S,k), nombres=(S.catE||[]).slice(), out=[];
  function mete(c){ if(nombres.indexOf(c)<0) nombres.push(c); }
  movsDe(S,k).forEach(function(m){ if(!esIngreso(m)) mete(catDe(m)); });
  Object.keys(p).forEach(mete);
  permsK(S,k).forEach(function(f){
    if(f && f.activo!==false && (f.tipo||"Egreso")!=="Ingreso") mete(f.cat||"Sin categoría"); });
  nombres.forEach(function(c){
    var g=0, n=0;
    movsDe(S,k).forEach(function(m){ if(!esIngreso(m) && catDe(m)===c){ g+=cts(m.monto); n++; } });
    var pf=0, pp=0;
    permsDeRubro(S,k,c,hoyIso).forEach(function(f){
      pf+=cts(f.monto);
      if(!movDePerm(S,k,f.id)) pp+=cts(f.monto);
    });
    var tiene = p[c]!=null && p[c]!=="";
    var pre = tiene? cts(p[c]) : null;
    out.push({cat:c, presC:pre, gastoC:g, n:n, permC:pf, permPendC:pp,
              quedaC:(pre==null?null:pre-g)});
  });
  return out;
}
/* Los rubros con importe asignado en esa ventana, que son exactamente los que
   suma totPresuC. Sirve para cotejar renglón por renglón con la app madre. */
function presuRubros(S,k){
  var p=presuDe(S,k), out=[];
  Object.keys(p).forEach(function(c){
    if(p[c]==null || p[c]==="") return;
    out.push({cat:c, presC:cts(p[c]), gastoC:gastoCatC(S,k,c)});
  });
  out.sort(function(a,b){ return b.presC-a.presC; });
  return out;
}
/* El cruce entre el movimiento y la tarjeta es por NOMBRE, y se compara sin
   acentos ni mayúsculas: "Promerica" y "Promérica" son la misma tarjeta. */
function mismoPago(a,b){ return clave(a)===clave(b) && clave(a)!==""; }
function gastoTarjetaC(S,k,nombre){ var c=0;
  movsDe(S,k).forEach(function(m){ if(!esIngreso(m) && mismoPago(m.pago,nombre)) c+=cts(m.monto); });
  return c; }
/* LO QUE SOBRÓ AL CERRAR LA VENTANA: lo que se apartó al rubro de ahorro (que
   salió como gasto) más todo lo que entró y no se gastó. */
function sobroC(S,k){
  var ap=apartadoAhorroC(S,k), sal=saldoC(S,k);
  return {apartado:ap, saldo:sal, total:ap+sal};
}

/* ---------- ventanas: mosaico de cortes, nunca meses del calendario ---------- */
function ventanasOrd(S){
  return (S.ventanas||[]).slice().sort(function(a,b){
    if(a.anio!==b.anio) return a.anio-b.anio;
    return PERIODOS.indexOf(a.per)-PERIODOS.indexOf(b.per);
  }).map(function(v){ return K(v.anio,v.per); });
}
function ultimaVentana(S){ var v=ventanasOrd(S); return v.length? v[v.length-1] : ""; }
function ventanaPrevia(S,k){ var v=ventanasOrd(S), i=v.indexOf(k); return i>0? v[i-1] : null; }

/* ---------- fechas de corte · INFORMACIÓN, nunca dinero (regla 3) ---------- */
function diasDelMes(a,m){ return new Date(a,m+1,0).getDate(); }
function fechaDia(a,m,d){ return new Date(a,m,Math.min(d,diasDelMes(a,m))); }
function dsol(f){ return new Date(f.getFullYear(),f.getMonth(),f.getDate()); }
function diasEntre(a,b){ return Math.round((dsol(b)-dsol(a))/86400000); }
/* El corte que atrapa una compra hecha hoy: el primero que cae hoy o después.
   Si hoy es día de corte, se cuenta hoy (lo conservador: se cobra ya). */
function corteQueAtrapa(dia,hoy){
  var h=dsol(hoy), f=fechaDia(h.getFullYear(),h.getMonth(),dia);
  if(f<h) f=fechaDia(h.getFullYear(),h.getMonth()+1,dia);
  return f;
}
function corteAnterior(dia,hoy){
  var h=dsol(hoy), f=fechaDia(h.getFullYear(),h.getMonth(),dia);
  if(f>=h) f=fechaDia(h.getFullYear(),h.getMonth()-1,dia);
  return f;
}
/* El primer día `dia` del mes que cae DESPUÉS de una fecha dada. */
function proxDiaDelMes(dia,desde){
  var h=dsol(desde), f=fechaDia(h.getFullYear(),h.getMonth(),dia);
  if(f<=h) f=fechaDia(h.getFullYear(),h.getMonth()+1,dia);
  return f;
}
/* FECHA LÍMITE DE PAGO: el primer día de pago que cae después de que ese corte
   cerró. Es un RECORDATORIO. No decide si algo está pagado —eso solo lo dice tu
   marca— y no mueve ningún número (regla 3).

   Son DOS fechas distintas y confundirlas es el error obvio:
     · el corte EN CURSO todavía no cerró, así que su pago siempre está por
       venir. Esa es la que va arriba, con los datos de la tarjeta.
     · el corte ANTERIOR ya cerró; su pago puede estar vencido. Esa es la que
       va abajo, junto a lo que se debe. */
function venceDe(tj,cierre,hoy){
  if(tj.pago==null || !(tj.pago>=1&&tj.pago<=31)) return null;
  if(tj.corte==null || !(tj.corte>=1&&tj.corte<=31)) return null;
  var f=proxDiaDelMes(tj.pago,cierre), d=diasEntre(hoy,f);
  return {fecha:f, dias:d, vencido:d<0, hoy:d===0};
}
function venceActual(tj,hoy){
  if(tj.corte==null || !(tj.corte>=1&&tj.corte<=31)) return null;
  return venceDe(tj,corteQueAtrapa(tj.corte,hoy),hoy);
}
function vencePago(tj,hoy){          /* el del corte anterior: el que está pendiente */
  if(tj.corte==null || !(tj.corte>=1&&tj.corte<=31)) return null;
  return venceDe(tj,corteAnterior(tj.corte,hoy),hoy);
}
/* Cuántos días faltan para el corte y cuántos pasaron desde el anterior. Sirve
   para saber en qué corte cae una compra de hoy; ningún monto sale de acá. */
function plazoDe(tj,hoy){
  var r={corte:null, hastaCorte:null, desdeCorte:null};
  if(tj.corte==null || !(tj.corte>=1&&tj.corte<=31)) return r;
  var ca=corteQueAtrapa(tj.corte,hoy), an=corteAnterior(tj.corte,hoy);
  r.corte=ca; r.hastaCorte=diasEntre(hoy,ca);
  /* desdeCorte es del corte ANTERIOR, no del abierto. No se muestra en la línea
     de datos generales: ahí todo tiene que hablar del corte que está abierto. */
  r.desdeCorte=diasEntre(an,hoy);
  return r;
}
/* EL LÍMITE TIENE MONEDA.
   tarjetas[].limite se guarda tal cual, en la moneda de tarjetas[].limMon, y
   NO viene convertido. El gasto siempre está en lempiras, así que para
   compararlos hay que convertir el límite al mostrar, y decir con qué tasa.
   Sin limMon se asume Lps. Sin tasa para esa moneda, no se estima nada. */
function tasaFx(S,mon){
  if(!mon || mon==="Lps" || mon==="HNL" || mon==="L") return 1;
  var v=(S&&S.fx)? +S.fx[mon] : 0;
  return (v>0)? v : 0;
}
function limiteLpsC(S,tj){
  var lim=cts(tj.limite), mon=tj.limMon||"Lps";
  if(!(lim>0)) return {hay:false, c:0, mon:mon, tasa:1, origC:0, sinTasa:false};
  var t=tasaFx(S,mon);
  if(!(t>0)) return {hay:false, c:0, mon:mon, tasa:0, origC:lim, sinTasa:true};
  return {hay:true, c:Math.round(lim*t), mon:mon, tasa:t, origC:lim, sinTasa:false};
}
/* =============================================================================
   FINANCIAMIENTOS DE UNA TARJETA  ·  minicuotas contra extrafinanciamiento
   -----------------------------------------------------------------------------
   En la app madre un financiamiento es un PERMANENTE con cat "Financiamiento".
   El banco escribe en la descripción de qué tipo es y por dónde va:
       "PROMOCION MINICUOTAS 12M CUOTA:09/12"   →  minicuota, 9 de 12
       "EXT18CUOTA: 10/"                        →  extrafinanciamiento, 10 de 18
   `leeCuotas` y `finCuotas` son copia de la madre: el conteo de cuotas pagadas
   NO sale del calendario, sale del ancla que él declaró más los movimientos
   que la app registró ligados a ese permanente.

   Al límite de la tarjeta solo le restamos las MINICUOTAS, que es lo que él
   pidió. El extrafinanciamiento se muestra aparte, informativo, sin tocar
   ninguna cifra.
============================================================================= */
var CAT_FIN="Financiamiento";
function esFinan(f){ return clave(f&&f.cat)===clave(CAT_FIN); }
/* Minicuota o extrafinanciamiento, según lo que escribe el banco. Si no lo dice,
   queda "otro" y NO se descuenta de nada: la app no adivina. */
function claseFin(f){
  if(!esFinan(f)) return null;
  var t=String(f.desc||"").toUpperCase();
  try{ t=t.normalize("NFD").replace(new RegExp("[\\u0300-\\u036f]","g"),""); }catch(e){}
  if(/MINI\s*-?\s*CUOTA/.test(t)) return "mini";
  if(/EXTRA\s*FINANCIAM/.test(t) || /\bEXT\s*\d/.test(t) || /\bEXT\b/.test(t)) return "ext";
  return "otro";
}
/* copia de la madre */
function leeCuotas(desc){
  var t=String(desc||"").toUpperCase(), m, r=null;
  if(m=t.match(/EXT\s*(\d{1,3})\s*M?\s*CUOTA[:\s]*(\d{1,3})/))      r={actual:+m[2], total:+m[1]};
  else if(m=t.match(/(\d{1,3})\s*M\b[\s\S]*?CUOTA[:\s]*(\d{1,3})/)) r={actual:+m[2], total:+m[1]};
  else if(m=t.match(/CUOTA[:\s]*(\d{1,3})\s*\/\s*(\d{1,3})\b/))     r={actual:+m[1], total:+m[2]};
  if(!r) return null;
  if(r.total>0 && r.actual>r.total) r.total=0;
  return r;
}
function cuotasRegistradas(S,f){
  var n=0;
  (S.movimientos||[]).forEach(function(m){ if(m.permId===f.id) n++; });
  return n;
}
function finCuotas(S,f){
  var lee=leeCuotas(f.desc)||{};
  var tot=+f.cuotasTotal||lee.total||0; if(!(tot>0)) tot=null;
  var reg=cuotasRegistradas(S,f), ancla=0, base=0, deTexto=false;
  if(+f.cuotasAncla>0){ ancla=+f.cuotasAncla; base=+f.cuotasAnclaReg||0; }
  else if(+f.cuotaActual>0){ ancla=+f.cuotaActual; base=Math.min(reg,1); }
  else if(lee.actual>0){ ancla=lee.actual; base=Math.min(reg,1); deTexto=true; }
  var pag=ancla+Math.max(0,reg-base);
  if(tot!=null && pag>tot) pag=tot;
  return {total:tot, pagadas:(ancla?pag:null), registradas:reg, ancla:ancla, deTexto:deTexto,
          restantes:(tot!=null&&ancla)? Math.max(0,tot-pag) : null};
}
/* Lo que esta tarjeta tiene tomado en financiamientos.
   saldo = cuota × cuotas que faltan. Si no se sabe cuántas faltan, NO se estima:
   ese financiamiento queda listado aparte como "sin datos de cuotas". */
function finTarjeta(S,k,nombre,hoyIso){
  var r={miniC:0, mini:[], ext:[], otro:[], sinDato:[], pendYaEnSaldoC:0};
  permsK(S,k).forEach(function(f){
    if(!f || f.activo===false) return;
    if((f.tipo||"Egreso")!=="Egreso") return;
    if(!(cts(f.monto)>0)) return;
    if(!mismoPago(f.pago,nombre)) return;
    if(!esFinan(f)) return;
    var cl=claseFin(f), fc=finCuotas(S,f), cuota=cts(f.monto);
    var reg=!!movDePerm(S,k,f.id);
    var it={desc:f.desc||f.cat||"financiamiento", cuotaC:cuota, clase:cl, reg:reg,
            total:fc.total, pagadas:fc.pagadas, restantes:fc.restantes,
            saldoC:(fc.restantes!=null)? cuota*fc.restantes : null};
    if(cl==="mini"){
      if(it.saldoC!=null){
        r.miniC+=it.saldoC; r.mini.push(it);
        /* La cuota de esta ventana que todavía no tiene movimiento ya va dentro
           del saldo de arriba. Si además la contáramos como gasto pendiente de
           la tarjeta, sería el mismo dinero dos veces. */
        if(!reg && permToca(S,f,hoyIso)) r.pendYaEnSaldoC+=cuota;
      }else r.sinDato.push(it);
    }
    else if(cl==="ext") r.ext.push(it);
    else r.otro.push(it);
  });
  return r;
}
/* =============================================================================
   CUPO REAL DE LA TARJETA
       límite real      = el límite de la libreta, convertido a lempiras
       − minicuotas     = cuota × cuotas que faltan, de cada minicuota de la tarjeta
       = límite actual
       − consumo de esta ventana (movimientos + permanentes sin marcar, menos las
         cuotas de minicuota que ya están dentro del saldo de arriba)
       − corte anterior, SOLO si no está marcado como pagado
       = disponible actual
   Nada de esto sale del calendario: el corte anterior pesa mientras la marca de
   pagado no exista, aunque la fecha ya haya pasado.
============================================================================= */
function cupoTjC(S,k,tj,hoyIso){
  var L=limiteLpsC(S,tj), fin=finTarjeta(S,k,tj.nombre,hoyIso);
  var g=gastoTjTotal(S,k,tj.nombre,hoyIso);
  var consumo=g.c-fin.pendYaEnSaldoC;
  var ant=deudaAnterior(S,k,tj);
  var arr=(ant && !ant.pagado)? Math.max(0,ant.c) : 0;
  var limAct=L.c-fin.miniC;
  return {hay:L.hay, lim:L, fin:fin, gasto:g,
          miniC:fin.miniC, limActC:limAct, consumoC:consumo,
          arrastreC:arr, arrastreK:ant?ant.k:null,
          arrastrePagado:ant?!!ant.pagado:null, hayAnterior:!!ant,
          dispC:limAct-consumo-arr};
}
/* EL TOPE ES UNO POR TARJETA, no uno por rubro: si da 7% en supermercados y 7%
   en farmacias, los dos acumulan contra el mismo tope. Los datos viejos traían
   un tope dentro de cada beneficio; si la tarjeta todavía no tiene el suyo, se
   muestran como estaban y no se suman. */
function topeTj(tj){
  var t=cts(tj.tope);
  if(t>0) return {hay:true, c:t, porBene:false};
  var hayViejo=(tj.benes||[]).some(function(b){ return +b.tope>0; });
  return {hay:false, c:0, porBene:hayViejo};
}
/* =============================================================================
   LO QUE CARGA UNA TARJETA EN ESTA VENTANA
   -----------------------------------------------------------------------------
   Dos fuentes, y cada peso entra UNA sola vez:
     · los movimientos registrados con esa forma de pago, y
     · los permanentes de esta ventana que se pagan con ella y que TODAVÍA no
       tienen movimiento.
   El permanente ya marcado NO se suma aparte: su movimiento ya está en la
   primera suma. Sumar las dos cosas es exactamente el error que hundió a la
   app anterior — contar el mismo dinero dos veces.

   Las reglas de si un permanente toca este período son las mismas de la app
   madre (mensual siempre toca; uno trimestral toca cuando su próximo cobro,
   contado desde el último pago REGISTRADO, ya llegó).
============================================================================= */
function cadaDe(f){ var n=parseInt(f&&f.cada,10); return (n>=1&&n<=12)?n:1; }
function mesDe(f){ return String(f||"").slice(0,7); }
function mesMas(ym,n){
  var p=String(ym||"").split("-"), a=parseInt(p[0],10), m=parseInt(p[1],10);
  if(isNaN(a)||isNaN(m)) return "";
  var t=a*12+(m-1)+(+n||0);
  return Math.floor(t/12)+"-"+String((t%12)+1).padStart(2,"0");
}
function movDePerm(S,k,pid){
  return movsDe(S,k).filter(function(m){ return m.permId===pid; })[0]||null;
}
function ultimoPagoPerm(S,pid){
  var mej=null;
  (S.movimientos||[]).forEach(function(m){
    if(m.permId!==pid || !m.fecha) return;
    if(!mej || String(m.fecha)>String(mej.fecha)) mej=m;
  });
  return mej;
}
function permToca(S,f,hoyIso){
  if(cadaDe(f)<=1) return true;
  var mv=ultimoPagoPerm(S,f.id);
  var base=mv? mesDe(mv.fecha) : (/^\d{4}-\d{2}$/.test(String(f.mesBase||""))? f.mesBase : "");
  if(!base) return true;
  var px=mesMas(base,cadaDe(f));
  if(!px) return true;
  return px <= mesDe(hoyIso);
}
/* Los permanentes de esta ventana que se pagan con esta tarjeta, con su estado. */
function permsTarjeta(S,k,nombre,hoyIso){
  var det=[], pend=0;
  permsK(S,k).forEach(function(f){
    if(!f || f.activo===false) return;
    if((f.tipo||"Egreso")!=="Egreso") return;
    if(!(cts(f.monto)>0)) return;
    if(!mismoPago(f.pago,nombre)) return;
    if(!permToca(S,f,hoyIso)) return;
    var reg=!!movDePerm(S,k,f.id);
    det.push({desc:f.desc||f.cat||"permanente", cat:f.cat||"", c:cts(f.monto), reg:reg});
    if(!reg) pend+=cts(f.monto);
  });
  return {det:det, pendC:pend};
}
function gastoTjTotal(S,k,nombre,hoyIso){
  var mov=gastoTarjetaC(S,k,nombre), pt=permsTarjeta(S,k,nombre,hoyIso);
  return {movC:mov, pendC:pt.pendC, c:mov+pt.pendC, det:pt.det};
}
/* LO QUE QUEDÓ DEBIENDO LA VENTANA ANTERIOR con esa tarjeta, y si marcaste ese
   corte como pagado. El monto sale de los movimientos; el estado, de tu marca.
   Nunca del calendario: si no está marcado, figura pendiente. */
function deudaAnterior(S,k,tj){
  var kp=ventanaPrevia(S,k);
  if(!kp) return null;
  return {k:kp, c:gastoTarjetaC(S,kp,tj.nombre), pagado:tjPagado(S,kp,tj.nombre)};
}
function tjPagado(S,k,nombre){ return (((S.tjPago||{})[k])||{})[nombre]===true; }
/* Un color tenue por tarjeta, para reconocerla de un vistazo. Sale de su
   posición en la libreta de la app madre, así que es el mismo color en todas
   las pantallas y en todos los aparatos. No significa nada más: no es estado,
   no es alerta, no entra en ningún número. */
var TJ_COLORES=[
  {bg:"#eff4fa", ln:"#9dbcd8"},
  {bg:"#f1f5eb", ln:"#b3c99a"},
  {bg:"#faf1ea", ln:"#dcb597"},
  {bg:"#f4eef9", ln:"#bfaed6"},
  {bg:"#ebf5f3", ln:"#96c5bd"},
  {bg:"#faf2e4", ln:"#d7be92"}
];
/* Colores dictados: los que él le puso a cada tarjeta. Se busca por el nombre
   sin acentos ni mayúsculas, y basta con que empiece igual ("economia bac" cae
   en "economia"). Lo que no esté acá sigue tomando color por su posición en la
   libreta, que es igual en todos los aparatos. */
var TJ_DICHO=[
  {pre:"economia",  bg:"#fbf6e4", ln:"#dcc476"},   /* amarilla */
  {pre:"gascard",   bg:"#ecf2fa", ln:"#8fb3d6"},   /* azul */
  {pre:"promerica", bg:"#f4eef9", ln:"#b9a7d3"}    /* morada */
];
function colorTj(S,nombre){
  var c=clave(nombre), i;
  for(i=0;i<TJ_DICHO.length;i++) if(c.indexOf(TJ_DICHO[i].pre)===0) return TJ_DICHO[i];
  var arr=(S&&S.tarjetas)||[]; i=-1;
  for(var j=0;j<arr.length;j++) if(clave(arr[j].nombre)===c){ i=j; break; }
  if(i<0){ var h=0, t=String(nombre||"");
    for(var q=0;q<t.length;q++) h=(h*31+t.charCodeAt(q))%9973; i=h; }
  return TJ_COLORES[i%TJ_COLORES.length];
}
function estiloTj(S,nombre){
  var c=colorTj(S,nombre); return "--tj-bg:"+c.bg+";--tj-ln:"+c.ln;
}
/* Qué formas de pago aparecen de verdad en los movimientos de la ventana, con
   cuántos. Sirve para ver de un vistazo si el nombre de una tarjeta no cruza
   con lo que llevan los movimientos. */
function formasUsadas(S,k){
  var m={}, out=[];
  movsDe(S,k).forEach(function(x){
    if(esIngreso(x)) return;
    var f=(x.pago||"").trim() || "(sin forma de pago)";
    m[f]=(m[f]||0)+1;
  });
  Object.keys(m).forEach(function(f){ out.push({pago:f, n:m[f]}); });
  out.sort(function(a,b){ return b.n-a.n; });
  return out;
}
/* Las formas de pago tal como están en la app madre, en su orden. Si la lista
   viniera vacía, se arman con las tarjetas anotadas más Efectivo. */
function formasDe(S){
  var f=(S.formas||[]).filter(function(x){ return x && String(x).trim(); });
  if(f.length) return f.slice();
  var t=(S.tarjetas||[]).map(function(x){ return x.nombre; }).filter(Boolean);
  t.push("Efectivo");

/* ---------- texto: comparar nombres sin que estorben acentos ni mayúsculas ---
   Se usa para cruzar el nombre de una tarjeta con lo que llevan los movimientos
   en «pago», y para buscar en el registro manual. */
function norm(s){
  var t=String(s||"").toLowerCase().trim();
  try{ t=t.normalize("NFD").replace(new RegExp("[\\u0300-\\u036f]","g"),""); }catch(e){}
  return t.replace(/[^a-z0-9ñ ]+/g," ").replace(/\s+/g," ").trim();
}
function clave(s){ return norm(s); }
/* "Farmacias" y "Farmacia" son lo mismo. "Supermercados" y "Despensa", no: el
   cruce es por el nombre, sin adivinar sinónimos. */
function raizPal(s){
  return clave(s).split(" ").map(function(w){ return w.replace(/(es|s)$/,""); }).join(" ");
}
function mismaCosa(a,b){ return raizPal(a)===raizPal(b) && raizPal(a)!==""; }
/* EQUIVALENCIAS DICTADAS: el banco nombra el beneficio de una forma y el rubro
   del presupuesto se llama de otra. Estas las dijo él, una por una. Lo que no
   esté acá y no coincida por nombre, no se cruza: la app no inventa sinónimos.
   Para agregar una: la izquierda es el beneficio, la derecha el rubro. */
var BENE_RUBRO={
  "supermercado": "Despensa",
  "gasolinera":   "Combustible",
  "educacion":    "Escuela"
};
/* EL RUBRO DEL BENEFICIO: el beneficio dice "Farmacias" y el rubro "Farmacia" →
   cruzan solos. "Supermercados" y "Despensa" solo cruzan por la tabla de arriba.
   Si no cruza por ninguna vía, no se muestra cifra. */
function rubroBene(S,k,que,hoyIso){
  if(!que) return null;
  var rs=rubrosDe(S,k,hoyIso), i, dicho=BENE_RUBRO[raizPal(que)];
  for(i=0;i<rs.length;i++) if(clave(rs[i].cat)===clave(que)) return rs[i];
  for(i=0;i<rs.length;i++) if(mismaCosa(rs[i].cat,que)) return rs[i];
  if(dicho) for(i=0;i<rs.length;i++) if(mismaCosa(rs[i].cat,dicho)) return rs[i];
  return null;
}
/* ---------- treemap cuadrado, a mano (squarified · Bruls-Huizing-van Wijk) ----
   Reparte un rectángulo en bloques de área proporcional al monto, armando
   franjas contra el lado corto y cerrando cada franja cuando meter un bloque
   más empeora la relación de aspecto. Devuelve porcentajes. */
function peorAspecto(fila,lado,suma){
  var mx=0,mn=Infinity;
  for(var i=0;i<fila.length;i++){ if(fila[i].a>mx)mx=fila[i].a; if(fila[i].a<mn)mn=fila[i].a; }
  if(!(suma>0)||!(mn>0)) return Infinity;
  var l2=lado*lado, s2=suma*suma;
  return Math.max(l2*mx/s2, s2/(l2*mn));
}
function squarify(datos,W,H){
  var out=[];
  var val=datos.filter(function(d){ return d.valor>0; })
               .sort(function(a,b){ return b.valor-a.valor; });
  var total=0; val.forEach(function(d){ total+=d.valor; });
  if(!(total>0)||!(W>0)||!(H>0)) return out;
  var esc=(W*H)/total;
  var items=val.map(function(d){ return {d:d, a:d.valor*esc}; });
  var r={x:0,y:0,w:W,h:H}, i=0;
  while(i<items.length && r.w>1e-9 && r.h>1e-9){
    var lado=Math.min(r.w,r.h);
    var fila=[items[i]], suma=items[i].a, j=i+1;
    while(j<items.length){
      var s2=suma+items[j].a;
      if(peorAspecto(fila.concat([items[j]]),lado,s2) > peorAspecto(fila,lado,suma)) break;
      fila.push(items[j]); suma=s2; j++;
    }
    if(r.w>=r.h){
      var an=suma/r.h, yy=r.y;
      fila.forEach(function(f){ var al=f.a/an;
        out.push({d:f.d, x:r.x, y:yy, w:an, h:al}); yy+=al; });
      r={x:r.x+an, y:r.y, w:r.w-an, h:r.h};
    }else{
      var al2=suma/r.w, xx=r.x;
      fila.forEach(function(f){ var an2=f.a/al2;
        out.push({d:f.d, x:xx, y:r.y, w:an2, h:al2}); xx+=an2; });
      r={x:r.x, y:r.y+al2, w:r.w, h:r.h-al2};
    }
    i=j;
  }
  return out;
}

/* Lo que le queda al rubro del beneficio. Negativo = ese rubro ya se pasó del
   presupuesto, y se dice con esa palabra en vez de con un signo menos. */
function txtQueda(r){
  if(!r.presC) return '<span class="d sin">sin presupuesto</span>';
  return (r.quedaC<0)
    ? '<span class="d neg">'+fmtC(-r.quedaC)+' excedido</span>'
    : '<span class="d">'+fmtC(r.quedaC)+' libres</span>';
}
/* Una fila de beneficio: el rubro, qué da, y —si ese rubro está en el
   presupuesto de este corte— cuánto le queda. Si el nombre no cruza con ningún
   rubro, la fila va sin cifra: la app no adivina a qué rubro pertenece. */
function filaBene(S,k,b,topeAparte){
  var r=rubroBene(S,k,b.que,hoyISO());
  return '<div class="bn'+(r?'" data-acc="bn" data-v="'+esc(r.cat):'')+'">'+
    '<span class="q">'+esc(b.que||"—")+'</span>'+
    '<span class="p">'+txtBene(b,topeAparte)+'</span>'+
    (r? txtQueda(r) : '')+

/* El estado del corte anterior en un símbolo, no en una frase. La marca es a
   mano en la app madre: sin marca, pendiente, aunque la fecha ya haya pasado. */
function marcaPago(pagado){
  return pagado
    ? '<span class="mk ok" title="Marcado como pagado en la app madre.">&#10003; pagado</span>'
    : '<span class="mk no" title="Sin marcar como pagado en la app madre. La marca es a mano: la fecha no la pone sola.">&#10005; sin pagar</span>';
}
function fmtD(d){
  function dd(n){ return (n<10?"0":"")+n; }
  return dd(d.getDate())+"/"+dd(d.getMonth()+1);
}
function txtVence(v){
  if(!v) return "";
  if(v.hoy) return "vence hoy";
  if(v.vencido) return "venció el "+fmtD(v.fecha);
  if(v.dias===1) return "vence mañana "+fmtD(v.fecha);
  return "vence el "+fmtD(v.fecha)+" · faltan "+v.dias+" días";
}
/* Los beneficios de la tarjeta, cada uno con lo que le queda a su rubro. */
function bloqueBenes(S,k,t){
  var tope=topeTj(t), h="";
  (t.benes||[]).forEach(function(b){ h+=filaBene(S,k,b,tope.hay); });
  if(!h) return '<div class="bene sub">Sin beneficios anotados.</div>';
  if(tope.hay) h+='<div class="bene sub" data-acc="ex" data-ex="tope">tope '+fmtC(tope.c)+
    ' entre todos los beneficios</div>';
  return h;
}
/* Los datos generales de la tarjeta, debajo del nombre.
   TODO lo de esta línea es del CORTE QUE ESTÁ ABIERTO: cuándo corta, cuándo
   paga, hasta cuándo se paga, cuánto es el límite y cuánto le toman las
   minicuotas. Nada de acá puede hablar del corte anterior — "cortó hace N días"

function datosTj(t,cu,pl,va){
  var h='<div class="tj-f" data-acc="ex" data-ex="corte">'+
    '<span>corta el '+esc(String(t.corte))+'</span>'+
    '<span>paga el '+esc(t.pago!=null?String(t.pago):"—")+'</span>'+
    (va? '<span>vence el '+esc(fmtD(va.fecha))+'</span>' : '')+'</div>';
  if(!cu.hay)
    return h+'<div class="tj-f" data-acc="ex" data-ex="cupo"><span>'+
      (cu.lim.sinTasa? "límite en "+esc(cu.lim.mon)+" sin tasa para convertir"
                     : "sin límite anotado")+'</span></div>';
  h+='<div class="tj-f" data-acc="tj-cupo" data-v="'+esc(t.nombre)+'">'+
      '<span>límite '+fmtC(cu.lim.c)+
        (cu.lim.mon!=="Lps"? ' ('+esc(cu.lim.mon)+' '+fmtC(cu.lim.origC).replace("L ","")+
          ' a '+esc(String(cu.lim.tasa))+')' : '')+'</span>'+
      (cu.miniC>0
        ? '<span>'+cu.fin.mini.length+' minicuota'+(cu.fin.mini.length===1?"":"s")+
          ' toma'+(cu.fin.mini.length===1?"":"n")+' '+fmtC(cu.miniC)+', queda <b>'+
          fmtC(cu.limActC)+'</b></span>'
        : '<span>sin minicuotas</span>')+
    '</div>';
  if(cu.fin.sinDato.length)
    h+='<div class="tj-f" data-acc="tj-cupo" data-v="'+esc(t.nombre)+'">'+
      '<span class="pend">'+cu.fin.sinDato.length+' minicuota'+(cu.fin.sinDato.length===1?"":"s")+
      ' sin cuotas cargadas: no se descuenta'+(cu.fin.sinDato.length===1?"":"n")+'</span></div>';
  return h;
}

          ? '<span class="vl chico">sin movimientos &middot; ver por qué</span>'
          : '<span class="vl num'+nSig(g.c)+'">'+fmtC(g.c)+'</span>'+
            '<span class="pie-est">'+
              (g.pendC>0
                ? fmtC(g.movC)+' registrados + '+fmtC(g.pendC)+' pendiente'+(nPend===1?"":"s")+' de pagar'
                : (g.det.length? 'todo lo permanente ya está registrado' : 'solo movimientos'))+
              ' &middot; ver detalle</span>')+

          ? '<span class="e">Corte anterior</span><span class="x">no hay corte anterior</span>'
          : '<span class="e">Corte anterior &middot; '+esc(nomVentana(ant.k))+'</span>'+
            (ant.c>0
              ? '<span class="v num">'+fmtC(ant.c)+'</span>'+marcaPago(ant.pagado)+
                ((v && !ant.pagado)? '<span class="x'+((v.vencido||v.dias<=1)?" pend":"")+'">'+
                    esc(txtVence(v))+'</span>' : '')+
                (!ant.pagado&&v? '<button class="lnk" data-acc="tj-ics" data-v="'+esc(t.nombre)+
                    '" title="Baja un archivo de calendario con aviso un día antes. Lo agrega tu celular, no la app.">recordarme</button>' : '')
              : '<span class="x">sin consumo</span>'))+
      '</div>'+
      '</div>';
  });
  return h+'</div>';

/* Un archivo de calendario con aviso un día antes. Se arma y se baja en el
   aparato: no se manda a ningún lado, no escribe nada en la nube y no marca
   nada como pagado. El recordatorio lo pone el calendario del celular. */
function icsPago(t,ant,v){
  function dd(n){ return (n<10?"0":"")+n; }
  function f(d){ return d.getFullYear()+dd(d.getMonth()+1)+dd(d.getDate()); }
  var ini=f(v.fecha), sig=f(new Date(v.fecha.getFullYear(),v.fecha.getMonth(),v.fecha.getDate()+1));
  var uid="fin-"+clave(t.nombre).replace(/ /g,"-")+"-"+ini+"@finanzas";
  var det="Corte "+nomVentana(ant.k)+": "+fmtC(ant.c)+
          ". Al "+fmtD(hoy())+" no estaba marcado como pagado en la app.";
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Finanzas//Consulta//ES","CALSCALE:GREGORIAN",
    "BEGIN:VEVENT","UID:"+uid,"DTSTAMP:"+ini+"T090000",
    "DTSTART;VALUE=DATE:"+ini,"DTEND;VALUE=DATE:"+sig,
    "SUMMARY:Pagar "+t.nombre,
    "DESCRIPTION:"+det.replace(/\n/g,"\\n"),
    "BEGIN:VALARM","TRIGGER:-P1D","ACTION:DISPLAY","DESCRIPTION:Mañana vence "+t.nombre,
    "END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
}
function bajaIcs(nombre){
  var t=(S.tarjetas||[]).filter(function(x){ return mismoPago(x.nombre,nombre); })[0];
  if(!t) return;
  var k=kAct(), ant=deudaAnterior(S,k,t), v=vencePago(t,hoy());
  if(!ant || !v){ toast("No hay fecha de pago anotada para esta tarjeta."); return; }
  var b=new Blob([icsPago(t,ant,v)],{type:"text/calendar;charset=utf-8"});
  var u=URL.createObjectURL(b), a=document.createElement("a");
  a.href=u; a.download="pago-"+clave(t.nombre).replace(/ /g,"-")+".ics";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(u); },4000);
  toast("Se bajó el recordatorio. Abrilo para agregarlo a tu calendario.");
}
function hojaGastoTj(nombre){
  var k=kAct(), g=gastoTjTotal(S,k,nombre,hoyISO());
  var ms=movsDe(S,k).filter(function(m){ return !esIngreso(m) && mismoPago(m.pago,nombre); })

  var h='<h3>'+esc(nombre)+'</h3>'+
    '<div class="hsub">'+esc(nomVentana(k))+' &middot; '+fmtC(g.c)+' en total</div>'+

      (g.pendC>0? ' y '+fmtC(g.pendC)+' en pagos permanentes que todavía no tienen movimiento.' : '.')+

      return '<div class="mv"><span class="f num">'+esc(fmtF(m.fecha))+'</span>'+

    : '<div class="vacio">Ninguno con esta tarjeta en este corte.</div>';

    var us=formasUsadas(S,k);
    h+='<div class="nota" style="margin:10px 0">No hay ningún movimiento con esta forma de pago '+

                : 'ninguna')+'. Si alguna es esta tarjeta escrita distinto, el nombre de la '+
      'libreta y el de la forma de pago tienen que coincidir en la app madre.</div>';
  }
  h+='<div class="hsec">Permanentes con esta tarjeta ('+g.det.length+')</div>';
  h+= g.det.length? g.det.map(function(d){

        '<span class="m num'+(d.reg?" sub":"")+'">'+fmtC(d.c)+'</span></div>'; }).join("")
    : '<div class="vacio">Ninguno se paga con esta tarjeta.</div>';

}

/* La cuenta del cupo, renglón por renglón, con el detalle de cada minicuota. */
function hojaCupoTj(nombre){
  var k=kAct(), tj=(S.tarjetas||[]).filter(function(x){ return mismoPago(x.nombre,nombre); })[0];
  if(!tj){ abreHoja('<h3>'+esc(nombre)+'</h3><div class="vacio">No está en la libreta.</div>'); return; }
  var cu=cupoTjC(S,k,tj,hoyISO());
  function ren(et,c,cls,pie){
    return '<div class="cta'+(cls?" "+cls:"")+'"><span class="e">'+et+
      (pie?'<small>'+pie+'</small>':'')+'</span><span class="v num">'+fmtC(c)+'</span></div>';
  }
  var h='<h3>'+esc(tj.nombre)+' &middot; cupo</h3>'+
    '<div class="hsub">'+esc(nomVentana(k))+'</div>';
  if(!cu.hay){
    h+='<div class="nota">'+(cu.lim.sinTasa
      ? 'El límite está anotado en '+esc(cu.lim.mon)+' y la app madre no tiene tasa para esa moneda, '+
        'así que no se convierte a lempiras. Sin eso no se puede estimar el disponible: no se inventa una tasa.'
      : 'Esta tarjeta no tiene límite anotado en la libreta de la app madre. Sin límite no hay disponible que calcular.')+
      '</div>';
    abreHoja(h); return;
  }
  h+=ren("Límite de la tarjeta",cu.lim.c,"",
        cu.lim.mon!=="Lps"? esc(cu.lim.mon)+" "+fmtC(cu.lim.origC).replace("L ","")+" a "+esc(String(cu.lim.tasa)) : "de la libreta")+
    ren("− minicuotas por pagar",cu.miniC,"res",
        cu.fin.mini.length? "cuota × cuotas que faltan, de "+cu.fin.mini.length+" minicuota"+(cu.fin.mini.length===1?"":"s") : "ninguna activa")+
    ren("Límite actual",cu.limActC,"tot","el cupo que el banco no tiene tomado")+
    ren("− consumo de este corte",cu.consumoC,"res",
        fmtC(cu.gasto.movC)+" en movimientos"+
        (cu.gasto.pendC>0? " + "+fmtC(cu.gasto.pendC)+" pendientes de pagar" : "")+
        (cu.fin.pendYaEnSaldoC>0? " − "+fmtC(cu.fin.pendYaEnSaldoC)+" de minicuota, que ya está arriba" : ""))+
    ren("− corte anterior",cu.arrastreC,"res",
        !cu.hayAnterior? "no hay corte anterior"
        : (cu.arrastrePagado? "marcado como pagado: no resta"
                            : "sin marcar como pagado: resta completo"))+
    ren("Disponible actual",cu.dispC,"tot fin","");
  if(cu.dispC<0) h+='<div class="nota">Negativo: entre lo financiado y lo consumido ya se pasó del límite anotado.</div>';
  h+='<p class="sub">El corte anterior pesa mientras no esté marcado como pagado en la app madre, '+
    'aunque la fecha de pago ya haya pasado: la app no da por hecho un pago que no está registrado. '+
    'Cada cuota de minicuota se descuenta del saldo cuando su movimiento existe, no cuando llega el mes.</p>';
  function lista(arr,tit,vacio,cuenta){
    var s='<div class="hsec">'+tit+' ('+arr.length+')</div>';
    if(!arr.length) return s+'<div class="vacio">'+vacio+'</div>';
    return s+arr.map(function(x){
      var pie=(x.total!=null && x.pagadas!=null)
        ? "cuota "+x.pagadas+" de "+x.total+" &middot; faltan "+x.restantes
        : "sin datos de cuotas";
      return '<div class="mv"><span class="d">'+esc(x.desc)+'<small>'+pie+
        ' &middot; cuota '+fmtC(x.cuotaC)+(x.reg?" &middot; la de este corte ya está registrada":"")+
        '</small></span><span class="m num'+(cuenta?"":" sub")+'">'+
        (x.saldoC!=null? fmtC(x.saldoC) : "—")+'</span></div>';
    }).join("");
  }
  h+=lista(cu.fin.mini,"Minicuotas · restan del límite","Ninguna con esta tarjeta.",true);
  if(cu.fin.sinDato.length)
    h+=lista(cu.fin.sinDato,"Minicuotas sin datos de cuotas","",false)+
      '<div class="nota">No se sabe cuántas cuotas faltan, así que no se estima su saldo ni se descuenta del límite. '+
      'Se arregla cargando «esta es la cuota N de M» en la app madre.</div>';
  if(cu.fin.ext.length)
    h+=lista(cu.fin.ext,"Extrafinanciamientos · informativos","",false)+
      '<div class="nota">No restan del límite acá: vos pediste que solo lo hicieran las minicuotas.</div>';
  if(cu.fin.otro.length)
    h+=lista(cu.fin.otro,"Financiamientos sin clasificar","",false)+
      '<div class="nota">La descripción no dice si es minicuota o extrafinanciamiento, así que no se descuenta de nada.</div>';
  abreHoja(h);
}
